/* ============================================================
   AS CRICKET SCORING — LOCAL FILE STORAGE
   Persistent app-specific store (survives restart/crash), organized as:
   AS Cricket Scoring/{Teams,Players,Matches,Index,Backup}
   Exported as real files/ZIP for user access (see exportBackupZip).
============================================================ */
const FS_KEY = "asCricketFS_v1";
const APP_FOLDER = "AS Cricket Scoring";

function fsDefault() {
  return {
    app: APP_FOLDER,
    version: 1,
    teams: {},    // tid -> Team_<tid> files
    players: {},  // pid -> Player_<pid>.json
    matches: {},  // matchId -> Match_<matchId>.json (source records)
    indexes: { matches: [], teams: [], players: [] },
    manifest: { files: {}, lastSyncAt: "", lastExportAt: "", lastRestoreAt: "" }
  };
}

var fsData = null;
function fsLoad() {
  try {
    const s = localStorage.getItem(FS_KEY);
    const parsed = s ? JSON.parse(s) : null;
    fsData = parsed && parsed.matches ? parsed : fsDefault();
    if (!fsData.manifest) fsData.manifest = fsDefault().manifest;
    if (!fsData.manifest.files) fsData.manifest.files = {};
  } catch (e) { fsData = fsDefault(); }
}

function fsSave() {
  try {
    localStorage.setItem(FS_KEY, JSON.stringify(fsData));
    return true;
  } catch (e) {
    console.error("Storage write failed:", e);
    return false;
  }
}

function validateJsonObj(o) {
  try {
    if (!o || typeof o !== "object") return false;
    JSON.stringify(o); // round-tripable
    return true;
  } catch (e) { return false; }
}

function fsMarkFile(path, driveKeep) {
  const prev = fsData.manifest.files[path] || {};
  fsData.manifest.files[path] = {
    version: (prev.version || 0) + 1,
    updatedAt: Date.now(),
    syncStatus: "pending",
    driveId: driveKeep === false ? null : (prev.driveId || null),
    lastError: ""
  };
  return fsData.manifest.files[path];
}

function renamePlayerEverywhere(pid, newName) {
  const key = Object.keys(state.playerDB || {}).find(function (k) { return state.playerDB[k].pid === pid; });
  if (!key || !newName || !nameKey(newName)) return false;
  const oldName = state.playerDB[key].name;
  const rec = state.playerDB[key];
  delete state.playerDB[key];
  rec.name = String(newName).trim();
  state.playerDB[nameKey(newName)] = rec;
  (state.matchHistory || []).forEach(function (m) {
    (m.innings || []).forEach(function (inn) {
      (inn.batters || []).forEach(function (b) { if (b.name === oldName) b.name = rec.name; });
      (inn.bowlers || []).forEach(function (b) { if (b.name === oldName) b.name = rec.name; });
      (inn.wicketsList || []).forEach(function (w) {
        if (w.fielder === oldName) w.fielder = rec.name;
        if (w.bowler === oldName) w.bowler = rec.name;
      });
    });
    if (m.potm && m.potm.name === oldName) m.potm.name = rec.name;
  });
  [state.match.players1, state.match.players2].forEach(function (list) {
    for (let i = 0; i < list.length; i++) if (list[i] === oldName) list[i] = rec.name;
  });
  try { fsRebuildAggregates(); } catch (e) {}
  save();
  return true;
}

function renameTeamEverywhere(tid, newName) {
  const key = Object.keys(state.teamDB || {}).find(function (k) { return state.teamDB[k].tid === tid; });
  if (!key || !newName || !nameKey(newName)) return false;
  const oldName = state.teamDB[key].name;
  const rec = state.teamDB[key];
  delete state.teamDB[key];
  rec.name = String(newName).trim();
  state.teamDB[nameKey(newName)] = rec;
  (state.matchHistory || []).forEach(function (m) {
    if (m.team1 === oldName) m.team1 = rec.name;
    if (m.team2 === oldName) m.team2 = rec.name;
    (m.innings || []).forEach(function (inn) {
      if (inn.battingTeam === oldName) inn.battingTeam = rec.name;
      if (inn.bowlingTeam === oldName) inn.bowlingTeam = rec.name;
    });
    if (m.winner === oldName) m.winner = rec.name;
  });
  if (state.match.team1 === oldName) state.match.team1 = rec.name;
  if (state.match.team2 === oldName) state.match.team2 = rec.name;
  try { fsRebuildAggregates(); } catch (e) {}
  save();
  return true;
}

function playerPid(name) {
  const p = state.playerDB[nameKey(name)];
  return p && p.pid ? p.pid : "";
}
function teamTid(name) {
  const t = state.teamDB[nameKey(name)];
  return t && t.tid ? t.tid : "";
}

// Build a complete individual match file (source record)
function fsMatchFile(entry, completed, liveInnings, liveMatch) {
  const m = liveMatch || {};
  const file = {
    matchId: entry.matchId,
    entryId: entry.id != null ? entry.id : null,
    date: entry.date,
    format: entry.oversLimit,               // overs format
    venue: entry.venue || "",
    settings: { oversLimit: entry.oversLimit },
    team1: entry.team1, team2: entry.team2,
    team1Id: entry.team1Id || teamTid(entry.team1),
    team2Id: entry.team2Id || teamTid(entry.team2),
    players1Ids: (entry.players1 || m.players1 || []).map(playerPid),
    players2Ids: (entry.players2 || m.players2 || []).map(playerPid),
    completed: !!completed,
    result: entry.result || null,
    winner: entry.winner || null,
    potm: entry.potm || null,
    innings: liveInnings || entry.innings || [],
    fielding: entry.fielding || {},
    updatedAt: Date.now()
  };
  return file;
}

function fsPutMatch(file) {
  if (!file || !file.matchId || !validateJsonObj(file)) return false;
  fsData.matches[String(file.matchId)] = file;
  // index (Matches/Matches_index via Index/matches_index.json)
  const ix = fsData.indexes.matches.filter(function (r) { return String(r.matchId) !== String(file.matchId); });
  ix.push({ matchId: file.matchId, date: file.date, team1: file.team1, team2: file.team2, completed: !!file.completed, winner: file.winner || "" });
  fsData.indexes.matches = ix;
  fsMarkFile("Matches/Match_" + file.matchId + ".json");
  fsMarkFile("Index/matches_index.json");
  return fsSave();
}

function fsPutPlayer(pid, name, stats, matchRefs) {
  if (!pid) return false;
  const rec = {
    playerId: pid,
    name: name,
    career: stats || {},
    matchRefs: matchRefs || [],
    updatedAt: Date.now()
  };
  if (!validateJsonObj(rec)) return false;
  fsData.players[pid] = rec;
  const ix = fsData.indexes.players.filter(function (r) { return r.playerId !== pid; });
  ix.push({ playerId: pid, name: name, matches: (matchRefs || []).length });
  fsData.indexes.players = ix;
  fsMarkFile("Players/Player_" + pid + ".json");
  fsMarkFile("Index/players_index.json");
  return true;
}

function fsPutTeam(tid, name, stats, matchRefs) {
  if (!tid) return false;
  const info = { teamId: tid, name: name, updatedAt: Date.now() };
  const st = { teamId: tid, name: name, stats: stats || {}, matchRefs: matchRefs || [], updatedAt: Date.now() };
  if (!validateJsonObj(st)) return false;
  fsData.teams[tid] = { team_info: info, team_stats: st, players: {}, matches: {} };
  const ix = fsData.indexes.teams.filter(function (r) { return r.teamId !== tid; });
  ix.push({ teamId: tid, name: name, matches: (matchRefs || []).length });
  fsData.indexes.teams = ix;
  fsMarkFile("Teams/Team_" + tid + "/team_info.json");
  fsMarkFile("Teams/Team_" + tid + "/team_stats.json");
  fsMarkFile("Index/teams_index.json");
  return true;
}

// Aggregates ALWAYS carry match references and are rebuilt from match records
function fsRebuildAggregates() {
  try {
    const career = computeCareerStats();
    Object.keys(state.playerDB || {}).forEach(function (k) {
      const p = state.playerDB[k];
      const st = career[p.name] || null;
      const refs = [];
      (state.matchHistory || []).forEach(function (m) {
        let hit = false;
        (m.innings || []).forEach(function (inn) {
          (inn.batters || []).forEach(function (b) { if (nameKey(b.name) === k) hit = true; });
          (inn.bowlers || []).forEach(function (b) { if (nameKey(b.name) === k) hit = true; });
        });
        if (hit && m.matchId) refs.push(String(m.matchId));
      });
      fsPutPlayer(p.pid || playerPid(p.name), p.name, st, refs);
    });
    Object.keys(state.teamDB || {}).forEach(function (k) {
      const t = state.teamDB[k];
      const st = computeTeamStats(t.name);
      const refs = (state.matchHistory || []).filter(function (m) {
        return m.team1 === t.name || m.team2 === t.name;
      }).map(function (m) { return String(m.matchId); });
      fsPutTeam(t.tid || teamTid(t.name), t.name, st, refs);
    });
    return fsSave();
  } catch (e) {
    console.error("Aggregate rebuild failed:", e);
    return false;
  }
}

// Live match file — updated IN PLACE on every scoring save (never a new file)
function fsUpdateActiveMatch() {
  if (!fsData) return false;
  const inn = state.innings[0];
  if (!inn || !state.match || !state.match.matchId) return false;
  const pseudoEntry = {
    matchId: state.match.matchId,
    id: state.historySavedId || null,
    date: new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }),
    oversLimit: state.match.oversLimit,
    team1: state.match.team1, team2: state.match.team2,
    players1: state.match.players1, players2: state.match.players2,
    result: state.result, winner: state.result ? (state.result.winner || "") : ""
  };
  const file = fsMatchFile(pseudoEntry, !!state.result, state.innings, state.match);
  file.paused = !!(state.pausedMatches || []).some(function (pm) { return String(pm.matchId) === String(state.match.matchId); });
  return fsPutMatch(file);
}

/* ============================================================
   GOOGLE DRIVE BACKUP — real Google Identity + Drive REST API
   Scope: drive.file (only files this app creates — least privilege).
   Local storage NEVER depends on this; failures never touch local data.
============================================================ */
const DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.file";
let gToken = null;

function netFetch(url, opts) {
  const f = window.__netFetch || (typeof fetch === "function" ? fetch : null);
  if (!f) return Promise.reject(new Error("Network is not available"));
  return f(url, opts);
}

function showBackupError(msg, retryFnName) {
  window.__backupErrMsg = msg;
  showModal(
    "<h2>⚠️ Backup problem</h2>" +
    '<div class="banner">' + esc(String(msg)) + "</div>" +
    '<div class="muted">Your local data is safe and unchanged.</div>' +
    (retryFnName ? '<button class="btn green block" style="padding:14px;margin-top:10px" onclick="closeModal();' + retryFnName + '()">🔁 Retry</button>' : "") +
    '<button class="btn ghost block" style="margin-top:10px;padding:12px" onclick="closeModal()">Close</button>',
    true
  );
}

function loadGisScript() {
  if (window.google && google.accounts && google.accounts.oauth2) return Promise.resolve(true);
  return new Promise(function (resolve, reject) {
    if (typeof document.createElement !== "function") { reject(new Error("Google Sign-In library unavailable")); return; }
    const s = document.createElement("script");
    s.src = "https://accounts.google.com/gsi/client";
    s.async = true;
    s.onload = function () { resolve(true); };
    s.onerror = function () { reject(new Error("Could not load Google Sign-In (check internet connection)")); };
    try { document.head.appendChild(s); } catch (e) { reject(e); }
  });
}

function driveConnected() {
  return !!(gToken && gToken.token && Date.now() < gToken.expiresAt);
}

function driveSignIn() {
  const cid = state.settings.googleClientId;
  if (!cid) {
    showBackupError("Google Client ID is not configured. In Settings → Google Drive, paste your OAuth Web Client ID (Google Cloud Console → APIs & Services → Credentials).");
    return Promise.resolve(false);
  }
  return loadGisScript().then(function () {
    return new Promise(function (resolve) {
      let client;
      try {
        client = google.accounts.oauth2.initTokenClient({
          client_id: cid,
          scope: DRIVE_SCOPE,
          callback: function (resp) {
            if (resp && resp.access_token) {
              gToken = { token: resp.access_token, expiresAt: Date.now() + Math.max(60, (resp.expires_in || 3600) - 60) * 1000 };
              state.sync.driveAccount = state.user.email || "Google account";
              state.sync.driveConnectedAt = new Date().toLocaleString();
              save();
              render();
              toast("Google Drive connected");
              resolve(true);
            } else {
              showBackupError("Google Drive sign-in was not completed" + (resp && resp.error ? ": " + resp.error : ""));
              resolve(false);
            }
          },
          error_callback: function (err) {
            showBackupError("Google Drive sign-in failed: " + ((err && err.message) || err || "unknown error"));
            resolve(false);
          }
        });
        client.requestAccessToken();
      } catch (e) {
        showBackupError("Google Sign-In init failed: " + (e && e.message ? e.message : e));
        resolve(false);
      }
    });
  }).catch(function (e) {
    showBackupError(e && e.message ? e.message : String(e));
    return false;
  });
}

function driveSignOut() {
  try {
    if (gToken && window.google && google.accounts && google.accounts.oauth2) {
      google.accounts.oauth2.revoke(gToken.token, function () {});
    }
  } catch (e) {}
  gToken = null;
  state.sync.driveConnectedAt = "";
  save();
  render();
  toast("Google Drive disconnected — local data kept");
}

function driveApi(path, opts) {
  if (!driveConnected()) return Promise.reject(new Error("Google Drive is not connected"));
  const headers = Object.assign({ Authorization: "Bearer " + gToken.token }, (opts && opts.headers) || {});
  return netFetch("https://www.googleapis.com/drive/v3" + path, Object.assign({}, opts || {}, { headers: headers }));
}

function driveListFolders(name, parentId) {
  let q = "mimeType='application/vnd.google-apps.folder' and trashed=false and name='" + name + "'";
  if (parentId) q += " and '" + parentId + "' in parents";
  return driveApi("/files?fields=files(id,name)&q=" + encodeURIComponent(q) + "&pageSize=1").then(function (r) {
    if (!r.ok) throw new Error("Drive list failed (HTTP " + r.status + ")");
    return r.json();
  }).then(function (j) { return (j.files && j.files[0]) || null; });
}

function driveCreateFolder(name, parentId) {
  const meta = { name: name, mimeType: "application/vnd.google-apps.folder", parents: parentId ? [parentId] : [] };
  return netFetch("https://www.googleapis.com/drive/v3/files", {
    method: "POST",
    headers: { Authorization: "Bearer " + gToken.token, "Content-Type": "application/json" },
    body: JSON.stringify(meta)
  }).then(function (r) {
    if (!r.ok) throw new Error("Drive folder create failed (HTTP " + r.status + ")");
    return r.json();
  });
}

function driveEnsureFolder(name, parentId) {
  return driveListFolders(name, parentId).then(function (f) {
    return f ? f : driveCreateFolder(name, parentId);
  });
}

let driveFolderCache = null;
function driveEnsureTree() {
  if (driveFolderCache) return Promise.resolve(driveFolderCache);
  return driveEnsureFolder(APP_FOLDER, null).then(function (root) {
    const jobs = ["Teams", "Players", "Matches", "Index", "Backup"].map(function (sub) {
      return driveEnsureFolder(sub, root.id).then(function (f) { return [sub, f.id]; });
    });
    return Promise.all(jobs).then(function (pairs) {
      driveFolderCache = { root: root.id, subs: {} };
      pairs.forEach(function (p) { driveFolderCache.subs[p[0]] = p[1]; });
      return driveFolderCache;
    });
  });
}

function driveUploadJson(relPath, obj, fileName) {
  // relPath like Matches/Match_X.json — uploads to the matching Drive subfolder
  const content = JSON.stringify(obj, null, 2);
  const parts = relPath.split("/");
  const folderKey = parts[0];
  return driveEnsureTree().then(function (tree) {
    const parentId = tree.subs[folderKey] || tree.root;
    return driveListFolders(fileName.replace(/\.json$/, ""), null).catch(function () { return null; }).then(function () {
      const rec = fsData.manifest.files[relPath] || {};
      const meta = { name: fileName, parents: [parentId] };
      const boundary = "as_cricket_" + Date.now();
      const body = "--" + boundary + "\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n" +
        JSON.stringify(meta) + "\r\n--" + boundary + "\r\nContent-Type: application/json\r\n\r\n" +
        content + "\r\n--" + boundary + "--";
      const url = rec.driveId
        ? "https://www.googleapis.com/upload/drive/v3/files/" + rec.driveId + "?uploadType=multipart"
        : "https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart";
      return netFetch(url, {
        method: rec.driveId ? "PATCH" : "POST",
        headers: { Authorization: "Bearer " + gToken.token, "Content-Type": "multipart/related; boundary=" + boundary },
        body: body
      }).then(function (r) {
        if (!r.ok) throw new Error("Upload of " + fileName + " failed (HTTP " + r.status + ")");
        return r.json();
      }).then(function (j) {
        if (!j || !j.id) throw new Error("Upload of " + fileName + " returned no file ID");
        rec.driveId = j.id; // stable mapping — retries update the SAME Drive file
        rec.syncStatus = "synced";
        rec.lastError = "";
        rec.syncedAt = Date.now();
        fsData.manifest.files[relPath] = rec;
        fsData.manifest.lastSyncAt = Date.now();
        fsSave();
        return j.id;
      });
    });
  });
}

function fsPendingFiles() {
  return Object.keys(fsData.manifest.files).filter(function (p) {
    return fsData.manifest.files[p].syncStatus === "pending" || fsData.manifest.files[p].syncStatus === "failed";
  });
}

function syncNow() {
  if (!driveConnected()) {
    showBackupError("Google Drive is not connected. Tap 'Connect Google Drive' first (internet required).");
    return Promise.resolve(false);
  }
  const pending = fsPendingFiles();
  if (!pending.length) {
    toast("Everything is already in sync");
    return Promise.resolve(true);
  }
  let chain = Promise.resolve();
  const uploaded = [];
  pending.forEach(function (path) {
    chain = chain.then(function () {
      let obj = null;
      if (/^Matches\//.test(path)) obj = fsData.matches[path.replace(/^Matches\/Match_/, "").replace(/\.json$/, "")];
      else if (/^Players\//.test(path)) obj = fsData.players[path.replace(/^Players\/Player_/, "").replace(/\.json$/, "")];
      else if (/team_info/.test(path)) { const tid = path.split("/")[1].replace("Team_", ""); obj = fsData.teams[tid] && fsData.teams[tid].team_info; }
      else if (/team_stats/.test(path)) { const tid = path.split("/")[1].replace("Team_", ""); obj = fsData.teams[tid] && fsData.teams[tid].team_stats; }
      else if (/^Index\//.test(path)) obj = fsData.indexes[path.split("/")[1].replace("_index.json", "")];
      else if (/Backup\//.test(path)) obj = fsData.manifest;
      if (!obj) {
        fsData.manifest.files[path].syncStatus = "failed";
        fsData.manifest.files[path].lastError = "file data is missing locally";
        fsSave();
        return null;
      }
      return driveUploadJson(path, obj, path.split("/").pop()).then(function () {
        uploaded.push(path);
      }).catch(function (e) {
        fsData.manifest.files[path].syncStatus = "failed";
        fsData.manifest.files[path].lastError = String((e && e.message) || e);
        fsSave();
      });
    });
  });
  return chain.then(function () {
    const failed = fsPendingFiles().length;
    if (uploaded.length && !failed) toast("✅ Backup complete — " + uploaded.length + " file(s) uploaded to Google Drive");
    else if (uploaded.length) toast(uploaded.length + " uploaded, " + failed + " failed — tap Retry Failed Uploads");
    else showBackupError("No files were uploaded. " + (fsData.manifest.files[fsPendingFiles()[0]] ? fsData.manifest.files[fsPendingFiles()[0]].lastError : ""), "retryFailedUploads");
    render();
    return uploaded.length > 0 && !failed;
  });
}

function retryFailedUploads() {
  fsPendingFiles().forEach(function (p) {
    if (fsData.manifest.files[p].syncStatus === "failed") fsData.manifest.files[p].syncStatus = "pending";
  });
  fsSave();
  return syncNow();
}

function restoreFromDrive() {
  if (!driveConnected()) {
    showBackupError("Google Drive is not connected. Tap 'Connect Google Drive' first.");
    return Promise.resolve(false);
  }
  return driveEnsureTree().then(function (tree) {
    return driveApi("/files?fields=files(id,name)&q=" + encodeURIComponent(
      "'" + tree.root + "' in parents or '" + tree.subs.Matches + "' in parents or '" + tree.subs.Players + "' in parents or '" + tree.subs.Teams + "' in parents"
    ) + "&pageSize=100").then(function (r) {
      if (!r.ok) throw new Error("Drive listing failed (HTTP " + r.status + ")");
      return r.json();
    });
  }).then(function (listing) {
    const files = (listing && listing.files) || [];
    const jobs = files.filter(function (f) { return /\.json$/.test(f.name); }).map(function (f) {
      return driveApi("/files/" + f.id + "?alt=media").then(function (r) {
        if (!r.ok) throw new Error("Download failed for " + f.name);
        return r.json();
      }).then(function (obj) { return { name: f.name, obj: obj }; }).catch(function () { return null; });
    });
    return Promise.all(jobs);
  }).then(function (items) {
    const snap = { matches: {}, players: {}, teams: {} };
    (items || []).forEach(function (it) {
      if (!it || !it.obj) return;
      if (/^Match_/.test(it.name) && it.obj.matchId) snap.matches[String(it.obj.matchId)] = it.obj;
      else if (/^Player_/.test(it.name) && it.obj.playerId) snap.players[it.obj.playerId] = it.obj;
      else if (/team_stats/.test(it.name) && it.obj.teamId) {
        snap.teams[it.obj.teamId] = snap.teams[it.obj.teamId] || { team_info: null, team_stats: null, players: {}, matches: {} };
        snap.teams[it.obj.teamId].team_stats = it.obj;
      } else if (/team_info/.test(it.name) && it.obj.teamId) {
        snap.teams[it.obj.teamId] = snap.teams[it.obj.teamId] || { team_info: null, team_stats: null, players: {}, matches: {} };
        snap.teams[it.obj.teamId].team_info = it.obj;
      }
    });
    if (!Object.keys(snap.matches).length && !Object.keys(snap.players).length && !Object.keys(snap.teams).length) {
      showBackupError("No AS Cricket Scoring backup files were found in the Drive folder.");
      return false;
    }
    const res = mergeFsSnapshot(snap, {});
    if (res.conflicts.length) {
      showConflictModal(res.conflicts, function () {
        toast("Drive restore complete — " + res.addedM + " new match(es)");
      });
    } else {
      toast("Drive restore complete — " + res.addedM + " matches, " + res.addedP + " players (" + res.skipped + " unchanged)");
    }
    render();
    return true;
  }).catch(function (e) {
    showBackupError("Drive restore failed: " + ((e && e.message) || e) + " — local data is untouched.", "restoreFromDrive");
    return false;
  });
}

function signOutWithCheck() {
  const pending = fsPendingFiles().length;
  if (pending) {
    showModal(
      "<h2>Sign out?</h2>" +
      '<div class="banner">⚠️ <b>' + pending + " file(s) are not yet synced</b> to Google Drive. Signing out will NOT delete any local data, but those files still need Sync later.</div>" +
      '<button class="btn amber block" style="padding:14px" onclick="closeModal();signOut()">Sign Out Anyway (local data kept)</button>' +
      '<button class="btn ghost block" style="margin-top:10px;padding:12px" onclick="closeModal()">Cancel</button>',
      false
    );
    return;
  }
  signOut();
}

/* ---- Real ZIP writer/reader (STORE) for user-accessible backup files ---- */
function crc32Table() {
  const t = new Uint32Array(256);
  for (let n = 0; n < 256; n++) {
    let c = n;
    for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
    t[n] = c >>> 0;
  }
  return t;
}
const CRC_TAB = crc32Table();
function crc32(u8) {
  let c = 0xFFFFFFFF;
  for (let i = 0; i < u8.length; i++) c = CRC_TAB[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
  return (c ^ 0xFFFFFFFF) >>> 0;
}

function buildZip(files) {
  // files: { path: contentString } -> real ZIP (stored) with folder structure
  const enc = new TextEncoder();
  const parts = [];
  const central = [];
  let offset = 0;
  Object.keys(files).forEach(function (path) {
    const nameB = enc.encode(path);
    const dataB = enc.encode(files[path]);
    const crc = crc32(dataB);
    const local = new Uint8Array(30 + nameB.length);
    const dv = new DataView(local.buffer);
    dv.setUint32(0, 0x04034b50, true);
    dv.setUint16(4, 20, true); dv.setUint16(6, 0, true); dv.setUint16(8, 0, true); // stored
    dv.setUint16(10, 0, true); dv.setUint16(12, 0x21, true); // time/date (fixed)
    dv.setUint32(14, crc, true);
    dv.setUint32(18, dataB.length, true);
    dv.setUint32(22, dataB.length, true);
    dv.setUint16(26, nameB.length, true); dv.setUint16(28, 0, true);
    local.set(nameB, 30);
    parts.push(local, dataB);
    const cen = new Uint8Array(46 + nameB.length);
    const cv = new DataView(cen.buffer);
    cv.setUint32(0, 0x02014b50, true);
    cv.setUint16(4, 20, true); cv.setUint16(6, 20, true);
    cv.setUint16(8, 0, true); cv.setUint16(10, 0, true);
    cv.setUint16(12, 0, true); cv.setUint16(14, 0x21, true);
    cv.setUint32(16, crc, true);
    cv.setUint32(20, dataB.length, true);
    cv.setUint32(24, dataB.length, true);
    cv.setUint16(28, nameB.length, true);
    cv.setUint32(42, offset, true);
    cen.set(nameB, 46);
    central.push(cen);
    offset += local.length + dataB.length;
  });
  let cenSize = 0;
  central.forEach(function (c) { cenSize += c.length; });
  const eocd = new Uint8Array(22);
  const ev = new DataView(eocd.buffer);
  ev.setUint32(0, 0x06054b50, true);
  ev.setUint16(8, central.length, true);
  ev.setUint16(10, central.length, true);
  ev.setUint32(12, cenSize, true);
  ev.setUint32(16, offset, true);
  return new Blob(parts.concat(central, [eocd]), { type: "application/zip" });
}

function parseZip(buf) {
  // reads STORE zips written by buildZip (scans local file headers)
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  const dec = new TextDecoder();
  const out = {};
  let p = 0;
  while (p + 30 <= u8.length) {
    const sig = dv.getUint32(p, true);
    if (sig !== 0x04034b50) break;
    const method = dv.getUint16(p + 8, true);
    const size = dv.getUint32(p + 18, true);
    const nameLen = dv.getUint16(p + 26, true);
    const extraLen = dv.getUint16(p + 28, true);
    const name = dec.decode(u8.subarray(p + 30, p + 30 + nameLen));
    const dataStart = p + 30 + nameLen + extraLen;
    if (method !== 0) { p = dataStart + size; continue; }
    out[name] = dec.decode(u8.subarray(dataStart, dataStart + size));
    p = dataStart + size;
  }
  return out;
}

function downloadBlob(blob, filename) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}

// Export the AS Cricket Scoring folder as a real downloadable ZIP
function exportBackupZip() {
  try {
    fsData.manifest.lastExportAt = Date.now();
    fsMarkFile("Backup/backup_manifest.json");
    fsSave();
    const tree = fsExportTree();
    tree["Backup/backup_manifest.json"] = JSON.stringify(fsData.manifest, null, 2);
    const zip = buildZip(tree);
    downloadBlob(zip, "AS Cricket Scoring Backup.zip");
    toast("Backup ZIP exported — " + Object.keys(tree).length + " files");
    return true;
  } catch (e) {
    showBackupError("Export failed: " + (e && e.message ? e.message : e));
    return false;
  }
}

// Real folder export where the File System Access API is available (desktop/installed app)
async function exportBackupFolder() {
  if (!window.showDirectoryPicker) {
    toast("Direct folder access is not available on this browser — exporting ZIP instead");
    return exportBackupZip();
  }
  try {
    const root = await window.showDirectoryPicker({ mode: "readwrite" });
    const appDir = await root.getDirectoryHandle(APP_FOLDER, { create: true });
    const tree = fsExportTree();
    for (const path of Object.keys(tree)) {
      const parts = path.split("/");
      let dir = appDir;
      for (let i = 0; i < parts.length - 1; i++) dir = await dir.getDirectoryHandle(parts[i], { create: true });
      const fh = await dir.getFileHandle(parts[parts.length - 1], { create: true });
      const w = await fh.createWritable(); // safe write: commits only on close()
      await w.write(tree[path]);
      await w.close();
    }
    fsData.manifest.lastExportAt = Date.now();
    fsMarkFile("Backup/backup_manifest.json");
    fsSave();
    toast("Backup folder written: " + APP_FOLDER + "/ (" + Object.keys(tree).length + " files)");
    return true;
  } catch (e) {
    if (e && e.name === "AbortError") return false;
    showBackupError("Folder export failed: " + (e && e.message ? e.message : e));
    return false;
  }
}

// Import/restore: validate JSON, merge by stable IDs, never drop local silently
function mergeFsSnapshot(snap, opts) {
  opts = opts || {};
  const conflicts = [];
  let addedM = 0, addedP = 0, addedT = 0, skipped = 0;
  (snap.matches ? Object.keys(snap.matches) : []).forEach(function (mid) {
    const incoming = snap.matches[mid];
    if (!validateJsonObj(incoming)) { skipped++; return; }
    const local = fsData.matches[mid];
    if (!local) { fsData.matches[mid] = incoming; addedM++; }
    else {
      const same = JSON.stringify(local) === JSON.stringify(incoming);
      if (!same) conflicts.push({ type: "match", id: mid, local: local, incoming: incoming });
      else skipped++;
    }
  });
  (snap.players ? Object.keys(snap.players) : []).forEach(function (pid) {
    const incoming = snap.players[pid];
    if (!validateJsonObj(incoming)) { skipped++; return; }
    const local = fsData.players[pid];
    if (!local) { fsData.players[pid] = incoming; addedP++; }
    else if (JSON.stringify(local) !== JSON.stringify(incoming)) conflicts.push({ type: "player", id: pid, local: local, incoming: incoming });
  });
  (snap.teams ? Object.keys(snap.teams) : []).forEach(function (tid) {
    const incoming = snap.teams[tid];
    if (!validateJsonObj(incoming)) { skipped++; return; }
    const local = fsData.teams[tid];
    if (!local) { fsData.teams[tid] = incoming; addedT++; }
    else if (JSON.stringify(local) !== JSON.stringify(incoming)) conflicts.push({ type: "team", id: tid, local: local, incoming: incoming });
  });
  fsData.indexes.matches = []; fsData.indexes.players = []; fsData.indexes.teams = [];
  Object.keys(fsData.matches).forEach(function (mid) {
    const f = fsData.matches[mid];
    fsData.indexes.matches.push({ matchId: f.matchId, date: f.date, team1: f.team1, team2: f.team2, completed: !!f.completed, winner: f.winner || "" });
  });
  Object.keys(fsData.players).forEach(function (pid) {
    fsData.indexes.players.push({ playerId: pid, name: fsData.players[pid].name, matches: (fsData.players[pid].matchRefs || []).length });
  });
  Object.keys(fsData.teams).forEach(function (tid) {
    fsData.indexes.teams.push({ teamId: tid, name: fsData.teams[tid].team_info ? fsData.teams[tid].team_info.name : "", matches: (fsData.teams[tid].team_stats ? fsData.teams[tid].team_stats.matchRefs || [] : []).length });
  });
  fsData.manifest.lastRestoreAt = Date.now();
  fsSave();
  return { addedM: addedM, addedP: addedP, addedT: addedT, skipped: skipped, conflicts: conflicts };
}

function resolveFsConflicts(conflicts, choice) {
  // choice: "local" (keep mine) | "incoming" (use backup)
  let applied = 0;
  conflicts.forEach(function (c) {
    const use = choice === "incoming" ? c.incoming : c.local;
    if (c.type === "match") fsData.matches[c.id] = use;
    else if (c.type === "player") fsData.players[c.id] = use;
    else if (c.type === "team") fsData.teams[c.id] = use;
    applied++;
  });
  fsSave();
  return applied;
}

function showConflictModal(conflicts, onDone) {
  window.__conflictList = conflicts;
  window.__conflictDone = onDone;
  showModal(
    "<h2>⚠️ Backup conflicts found</h2>" +
    '<div class="banner">' + conflicts.length + " record(s) exist with different content locally and in the backup. Nothing has been overwritten.</div>" +
    '<button class="btn blue block" style="padding:14px" onclick="resolveConflictsUI(\'local\')">Keep My Local Data</button>' +
    '<button class="btn amber block" style="margin-top:10px;padding:14px" onclick="resolveConflictsUI(\'incoming\')">Use Backup Data</button>' +
    '<button class="btn ghost block" style="margin-top:10px;padding:12px" onclick="resolveConflictsUI(\'cancel\')">Cancel Restore</button>',
    false
  );
}

function resolveConflictsUI(choice) {
  const conflicts = window.__conflictList || [];
  closeModal();
  if (choice !== "cancel") {
    const n = resolveFsConflicts(conflicts, choice);
    toast(n + " conflict(s) resolved — kept " + (choice === "incoming" ? "backup" : "local") + " versions");
  } else {
    toast("Restore cancelled — local data untouched");
  }
  const done = window.__conflictDone;
  window.__conflictList = null;
  window.__conflictDone = null;
  if (done) done(choice);
}

async function importBackupFile(file) {
  try {
    const buf = await file.arrayBuffer();
    let snap = null;
    if (/\.zip$/i.test(file.name)) {
      const files = parseZip(buf);
      snap = { matches: {}, players: {}, teams: {} };
      Object.keys(files).forEach(function (path) {
        let obj = null;
        try { obj = JSON.parse(files[path]); } catch (e) { return; }
        if (/^Matches\/Match_/.test(path) && obj && obj.matchId) snap.matches[String(obj.matchId)] = obj;
        else if (/^Players\/Player_/.test(path) && obj && obj.playerId) snap.players[obj.playerId] = obj;
        else if (/^Teams\/Team_/.test(path) && obj && obj.teamId && /team_stats/.test(path)) {
          snap.teams[obj.teamId] = snap.teams[obj.teamId] || { team_info: null, team_stats: null, players: {}, matches: {} };
          snap.teams[obj.teamId].team_stats = obj;
        } else if (/^Teams\/Team_/.test(path) && obj && obj.teamId && /team_info/.test(path)) {
          snap.teams[obj.teamId] = snap.teams[obj.teamId] || { team_info: null, team_stats: null, players: {}, matches: {} };
          snap.teams[obj.teamId].team_info = obj;
        }
      });
    } else {
      snap = JSON.parse(new TextDecoder().decode(buf));
    }
    if (!snap || (!snap.matches && !snap.players && !snap.teams)) {
      showBackupError("Invalid backup file — no AS Cricket Scoring records found.");
      return false;
    }
    const res = mergeFsSnapshot(snap, {});
    if (res.conflicts.length) {
      showConflictModal(res.conflicts, function () {
        toast("Restore complete: " + res.addedM + " matches, " + res.addedP + " players, " + res.addedT + " teams");
      });
    } else {
      toast("Restore complete: " + res.addedM + " matches, " + res.addedP + " players, " + res.addedT + " teams (" + res.skipped + " unchanged)");
    }
    return true;
  } catch (e) {
    showBackupError("Restore failed: " + (e && e.message ? e.message : e) + " — local data is untouched.");
    return false;
  }
}

function fsExportTree() {
  const tree = {};
  tree["Index/matches_index.json"] = JSON.stringify(fsData.indexes.matches, null, 2);
  tree["Index/teams_index.json"] = JSON.stringify(fsData.indexes.teams, null, 2);
  tree["Index/players_index.json"] = JSON.stringify(fsData.indexes.players, null, 2);
  tree["Backup/backup_manifest.json"] = JSON.stringify(fsData.manifest, null, 2);
  Object.keys(fsData.matches).forEach(function (id) {
    tree["Matches/Match_" + id + ".json"] = JSON.stringify(fsData.matches[id], null, 2);
  });
  Object.keys(fsData.players).forEach(function (pid) {
    tree["Players/Player_" + pid + ".json"] = JSON.stringify(fsData.players[pid], null, 2);
  });
  Object.keys(fsData.teams).forEach(function (tid) {
    const t = fsData.teams[tid];
    tree["Teams/Team_" + tid + "/team_info.json"] = JSON.stringify(t.team_info, null, 2);
    tree["Teams/Team_" + tid + "/team_stats.json"] = JSON.stringify(t.team_stats, null, 2);
    Object.keys(t.players || {}).forEach(function (pid) {
      tree["Teams/Team_" + tid + "/Players/Player_" + pid + ".json"] = JSON.stringify(t.players[pid], null, 2);
    });
    Object.keys(t.matches || {}).forEach(function (mid) {
      tree["Teams/Team_" + tid + "/Matches/Match_" + mid + ".json"] = JSON.stringify(t.matches[mid], null, 2);
    });
  });
  return tree;
}

function clampNum(v, lo, hi) {
  v = parseFloat(v);
  if (isNaN(v)) v = 1;
  return Math.max(lo, Math.min(hi, v));
}

function applyUISettings() {
  const s = state.settings || {};
  const ts = clampNum(s.textScale, 0.8, 1.8);
  const us = clampNum(s.uiScale, 0.85, 1.5);
  const ss = clampNum(s.sugScale, 0.9, 1.6);
  s.textScale = ts; s.uiScale = us; s.sugScale = ss;
  try {
    const r = document.documentElement.style;
    r.setProperty("--text-scale", String(ts));
    r.setProperty("--ui-scale", String(us));
    r.setProperty("--sug-scale", String(ss));
    document.body.style.zoom = String(us);
  } catch (e) {}
  try { applyAppearance(); } catch (e) {}
}

function updateSizeLabels() {
  const d = sizeDraft || state.settings;
  const a = document.getElementById("tsLabel");
  if (a) a.textContent = Math.round((d.textScale || 1) * 100) + "%";
  const b = document.getElementById("usLabel");
  if (b) b.textContent = Math.round((d.uiScale || 1) * 100) + "%";
  const c = document.getElementById("ssLabel");
  if (c) c.textContent = Math.round((d.sugScale || 1) * 100) + "%";
  const a2 = document.getElementById("tsCur");
  if (a2) a2.textContent = Math.round((state.settings.textScale || 1) * 100) + "%";
  const b2 = document.getElementById("usCur");
  if (b2) b2.textContent = Math.round((state.settings.uiScale || 1) * 100) + "%";
  const c2 = document.getElementById("ssCur");
  if (c2) c2.textContent = Math.round((state.settings.sugScale || 1) * 100) + "%";
  const hint = document.getElementById("sizePendingHint");
  if (hint) {
    hint.textContent = sizeDraftDirty()
      ? "⚠️ Unapplied changes — tap OK / Apply to confirm, or Discard Changes."
      : "";
  }
}

// ---- Size settings: draft -> Preview -> OK/Apply -> Confirm ----
// Applied values live in state.settings (persisted). Draft values are temporary
// and are NEVER applied to the app or saved until the user explicitly confirms.
let sizeDraft = null;

function ensureSizeDraft() {
  if (!sizeDraft) sizeDraft = {
    textScale: state.settings.textScale || 1,
    uiScale: state.settings.uiScale || 1,
    sugScale: state.settings.sugScale || 1
  };
  return sizeDraft;
}

function sizeDraftDirty() {
  if (!sizeDraft) return false;
  return Math.round(sizeDraft.textScale * 100) !== Math.round((state.settings.textScale || 1) * 100) ||
    Math.round(sizeDraft.uiScale * 100) !== Math.round((state.settings.uiScale || 1) * 100) ||
    Math.round(sizeDraft.sugScale * 100) !== Math.round((state.settings.sugScale || 1) * 100);
}

// draft handlers — update temporary values only; never touch the app or storage
function draftTextScale(v) {
  ensureSizeDraft().textScale = clampNum(parseFloat(v) / 100, 0.8, 1.8);
  window.__sizePreviewed = false;
  updateSizeLabels();
}
function draftUIScale(v) {
  ensureSizeDraft().uiScale = clampNum(parseFloat(v) / 100, 0.85, 1.5);
  window.__sizePreviewed = false;
  updateSizeLabels();
}
function draftSugScale(v) {
  ensureSizeDraft().sugScale = clampNum(parseFloat(v) / 100, 0.9, 1.6);
  window.__sizePreviewed = false;
  updateSizeLabels();
}
function draftTextPreset(pct) {
  draftTextScale(pct);
  const sl = document.getElementById("tsRange"); if (sl) sl.value = String(pct);
}
function draftUIPreset(pct) {
  draftUIScale(pct);
  const sl = document.getElementById("usRange"); if (sl) sl.value = String(pct);
}
function draftSugPreset(pct) {
  draftSugScale(pct);
  const sl = document.getElementById("ssRange"); if (sl) sl.value = String(pct);
}

// Preview — proposed sizes applied ONLY inside the preview area
function previewSizes() {
  const d = ensureSizeDraft();
  const box = document.getElementById("sizePreviewBox");

function playerSuggestions(query, limit) {
  const q = String(query || "").trim().toLowerCase();
  const names = Object.keys(state.playerDB || {}).map(function (k) { return state.playerDB[k].name; });
  if (!q) return names.sort().slice(0, limit || 10);
  const starts = [], contains = [];
  names.forEach(function (n) {
    const ln = n.toLowerCase();
    if (ln.indexOf(q) === 0) starts.push(n);
    else if (ln.indexOf(q) > 0) contains.push(n);
  });
  starts.sort();
  contains.sort();
  return starts.concat(contains).slice(0, limit || 8);
}

/* ============================================================
   MATCH HISTORY · POTM · POINTS TABLE · CAREER STATS
============================================================ */
function calcPOTM() {
  const scores = {};
  function g(name) {
    if (!scores[name]) scores[name] = { name: name, pts: 0, bat: null, bowl: null };
    return scores[name];
  }
  state.innings.forEach(function (inn) {
    if (!inn) return;
    inn.batters.forEach(function (b) {
      if (b.status === "didnotbat" && b.runs === 0 && b.balls === 0) return;
      const s = g(b.name);
      s.pts += b.runs + b.fours + b.sixes * 2;
      if (b.balls > 0 || b.runs > 0) s.bat = b;
    });
    inn.bowlers.forEach(function (b) {
      if (b.balls === 0 && b.wickets === 0 && b.runs === 0) return;
      const s = g(b.name);
      s.pts += b.wickets * 20 + b.maidens * 10;
      if (b.wickets > 0 || b.balls > 0) s.bowl = b;
    });
  });
  let best = null;
  Object.keys(scores).forEach(function (k) {
    const s = scores[k];
    if (!best || s.pts > best.pts) best = s;
  });
  if (!best) return null;
  const parts = [];
  if (best.bat && (best.bat.runs > 0 || best.bat.balls > 0)) parts.push(best.bat.runs + " (" + best.bat.balls + ")");
  if (best.bowl && (best.bowl.wickets > 0 || best.bowl.balls > 0)) parts.push(best.bowl.wickets + "/" + best.bowl.runs);
  best.note = parts.join(" & ") || "match winner";
  return best;
}

function saveMatchToHistory() {
  if (state.historySavedId) return null;
  // unique match ID guard: never count/save the same match twice
  const matchKey = state.match && state.match.matchId ? String(state.match.matchId) : null;
  if (matchKey) {
    const already = (state.matchHistory || []).find(function (m) { return String(m.matchId) === matchKey; });
    if (already) {
      state.historySavedId = already.id;
      return null;
    }
  }
  const i1 = state.innings[0], i2 = state.innings[1];
  if (!i1 || !i2) return null;
  const res = computeResult();
  if (!res) return null;
  let winner = "tie";
  if (i2.runs > i1.runs) winner = i2.battingTeam;
  else if (i1.runs > i2.runs) winner = i1.battingTeam;
  const potm = calcPOTM();
  const entry = {
    id: nextHistId(),
    matchId: state.match.matchId || newMatchId(),
    date: new Date().toLocaleDateString("en-IN", { day: "numeric", month: "short", year: "numeric" }),
    team1: state.match.team1,
    team2: state.match.team2,
    oversLimit: state.match.oversLimit,
    result: res,
    winner: winner,
    potm: potm ? { name: potm.name, note: potm.note, pts: potm.pts } : null,
    fielding: aggregateFielding(state.innings.filter(Boolean)),
    innings: state.innings.filter(Boolean).map(function (inn) {
      return {
        battingTeam: inn.battingTeam,
        bowlingTeam: inn.bowlingTeam,
        runs: inn.runs,
        wickets: inn.wickets,
        balls: inn.legalBalls,
        extras: { wd: inn.extras.wd, nb: inn.extras.nb, b: inn.extras.b, lb: inn.extras.lb },
        batters: inn.batters.filter(function (b) { return b.status !== "didnotbat"; }).map(function (b) {
          return { name: b.name, runs: b.runs, balls: b.balls, fours: b.fours, sixes: b.sixes, dots: b.dots || 0, status: b.status, how: b.how };
        }),
        bowlers: inn.bowlers.map(function (b) {
          return { name: b.name, balls: b.balls, runs: b.runs, wickets: b.wickets, maidens: b.maidens, dots: b.dots || 0, wd: b.wd || 0, nb: b.nb || 0 };
        }),
        fow: inn.fow.map(function (f) {
          return { runs: f.runs, wickets: f.wickets, over: f.over, batter: f.batter };
        }),
        shots: (inn.shots || []).map(function (s) {
          return { batter: s.batter, runs: s.runs, s: s.s, team: s.team };
        }),
        wicketsList: (inn.wicketsList || []).map(function (w) {
          return { type: w.type, fielder: w.fielder, out: w.out, bowler: w.bowler, batter: w.batter, over: w.over };
        })
      };
    })
  };
  if (!state.matchHistory) state.matchHistory = [];
  state.matchHistory.unshift(entry);
  if (state.matchHistory.length > 200) state.matchHistory.pop();
  state.historySavedId = entry.id;
  state.lastPotm = entry.potm;
  try {
    fsPutMatch(fsMatchFile(entry, true));   // final Match_<ID>.json (source record)
    fsRebuildAggregates();                   // team/player files + match references
  } catch (e) {}
  return entry;
}

function computePointsTable() {
  const T = {};
  const seenMatches = {};
  function team(name) {
    if (!T[name]) T[name] = { name: name, p: 0, w: 0, l: 0, t: 0, pts: 0, rf: 0, ra: 0, bf: 0, ba: 0, nrr: 0 };
    return T[name];
  }
  if (state.match) { team(state.match.team1); team(state.match.team2); }
  (state.matchHistory || []).forEach(function (m) {
    const mk = String(m.matchId != null ? m.matchId : m.id);
    if (seenMatches[mk]) return; // same match ID counted only once
    seenMatches[mk] = true;
    team(m.team1); team(m.team2);
    const i1 = m.innings[0], i2 = m.innings[1];
    if (i1 && i2) {
      const t1 = team(i1.battingTeam), t2 = team(i2.battingTeam);
      t1.rf += i1.runs; t1.bf += i1.balls;
      t1.ra += i2.runs; t1.ba += i2.balls;
      t2.rf += i2.runs; t2.bf += i2.balls;
      t2.ra += i1.runs; t2.ba += i1.balls;
    }
    const a = team(m.team1), b = team(m.team2);
    a.p++; b.p++;
    if (m.winner === "tie") { a.t++; b.t++; a.pts++; b.pts++; }
    else if (m.winner) {
      const w = team(m.winner);
      const l = (m.winner === m.team1) ? b : a;
      w.w++; w.pts += 2; l.l++;
    }
  });
  const rows = Object.keys(T).map(function (k) {
    const t = T[k];
    const or = t.bf > 0 ? t.rf / (t.bf / 6) : 0;
    const oc = t.ba > 0 ? t.ra / (t.ba / 6) : 0;
    t.nrr = or - oc;
    return t;
  });
  rows.sort(function (x, y) { return y.pts - x.pts || y.nrr - x.nrr; });
  return rows;
}

function computeCareerStats() {
  const P = {};
  const seenMatches = {};
  function p(name, teamName) {
    const key = String(name).trim();
    if (!P[key]) {
      P[key] = {
        name: key, team: teamName || "", mat: 0, inns: 0, runs: 0, balls: 0, fours: 0, sixes: 0,
        hs: 0, dismissals: 0, oballs: 0, oruns: 0, maidens: 0, wkts: 0,
        bestW: -1, bestR: 0, potm: 0,
        catches: 0, runOuts: 0, stumpings: 0,
        shots: {},
        batDots: 0,
        s20: 0, s30: 0, s40: 0, s50: 0, s60: 0,
        bowlDots: 0, bowlWd: 0, bowlNb: 0,
        s100: 0, s50plus: 0, notOuts: 0, bowlInns: 0
      };
    }
    if (teamName && !P[key].team) P[key].team = teamName;
    return P[key];
  }
  (state.matchHistory || []).forEach(function (m) {
    const mk = String(m.matchId != null ? m.matchId : m.id);
    if (seenMatches[mk]) return; // same match ID counted only once
    seenMatches[mk] = true;
    const seen = {};
    m.innings.forEach(function (inn) {
      inn.batters.forEach(function (b) {
        const pl = p(b.name, inn.battingTeam);
        pl.runs += b.runs; pl.balls += b.balls; pl.fours += b.fours; pl.sixes += b.sixes;
        pl.batDots += b.dots || 0;
        pl.inns++;
        if (b.runs > pl.hs) pl.hs = b.runs;
        if (b.status === "out") pl.dismissals++;
        else pl.notOuts++;
        const r = b.runs || 0;
        if (r >= 100) pl.s100++;
        if (r >= 50) pl.s50plus++;
        if (r >= 60) pl.s60++;
        else if (r >= 50) pl.s50++;
        else if (r >= 40) pl.s40++;
        else if (r >= 30) pl.s30++;
        else if (r >= 20) pl.s20++;
        seen[b.name] = true;
      });
      inn.bowlers.forEach(function (b) {
        const pl = p(b.name, inn.bowlingTeam);
        pl.oballs += b.balls; pl.oruns += b.runs; pl.maidens += b.maidens; pl.wkts += b.wickets;
        pl.bowlDots += b.dots || 0;
        pl.bowlWd += b.wd || 0;
        pl.bowlNb += b.nb || 0;
        if (b.balls > 0) pl.bowlInns++;
        if (b.wickets > pl.bestW || (b.wickets === pl.bestW && b.runs < pl.bestR)) {
          pl.bestW = b.wickets; pl.bestR = b.runs;
        }
        seen[b.name] = true;
      });
    });
    // fielding credits
    if (m.fielding) {
      Object.keys(m.fielding).forEach(function (fn) {
        const pl = p(fn);
        const f = m.fielding[fn];
        pl.catches += f.c || 0;
        pl.runOuts += f.ro || 0;
        pl.stumpings += f.st || 0;
        seen[fn] = true;
      });
    }
    // shot map (wagon wheel) data
    m.innings.forEach(function (inn) {
      (inn.shots || []).forEach(function (s) {
        const pl = p(s.batter, inn.battingTeam);
        if (!pl.shots[s.s]) pl.shots[s.s] = { n: 0, runs: 0 };
        pl.shots[s.s].n++;
        pl.shots[s.s].runs += s.runs || 0;
        seen[s.batter] = true;
      });
    });
    Object.keys(seen).forEach(function (k) { p(k).mat++; });
    if (m.potm && m.potm.name) p(m.potm.name).potm++;
  });
  return P;
}

function playerMatchHistory(name) {
  const rows = [];
  (state.matchHistory || []).forEach(function (m) {
    let bat = null, bowl = null, team = "";
    m.innings.forEach(function (inn) {
      inn.batters.forEach(function (b) {
        if (b.name === name) { bat = b; team = inn.battingTeam; }
      });
      inn.bowlers.forEach(function (b) {
        if (b.name === name) { bowl = b; if (!team) team = inn.bowlingTeam; }
      });
    });
    let field = "";
    if (m.fielding && m.fielding[name]) {
      const f = m.fielding[name];
      const parts = [];
      if (f.c) parts.push(f.c + " catch" + (f.c > 1 ? "es" : ""));
      if (f.ro) parts.push(f.ro + " run out" + (f.ro > 1 ? "s" : ""));
      if (f.st) parts.push(f.st + " stumping" + (f.st > 1 ? "s" : ""));
      field = parts.join(", ");
    }
    if (bat || bowl || field) {
      rows.push({
        date: m.date,
        match: m.team1 + " vs " + m.team2,
        team: team,
        bat: bat,
        bowl: bowl,
        field: field,
        result: m.result.headline,
        potm: m.potm && m.potm.name === name
      });
    }
  });
  return rows;
}

/* ============================================================
   RENDER ROUTER
============================================================ */
function go(screen) {
  if (sizeDraft && state.screen === "profile" && screen !== "profile") {
    sizeDraft = null; // leaving Settings discards unconfirmed size changes
    window.__sizePreviewed = false;
  }
  if (themeDraft && state.screen === "profile" && screen !== "profile") {
    themeDraft = null;
    window.__themePreviewed = false;
  }
  if (shapeDraft && state.screen === "profile" && screen !== "profile") {
    shapeDraft = null;
    window.__shapePreviewed = false;
  }
  if (state.screen && state.screen !== screen) {
    navStack.push(state.screen);
    if (navStack.length > 40) navStack.shift();
  }
  state.screen = screen;
  save();
  render();
}

function goBack() {
  // 1) Inside a modal: step back through modal history, else close it.
  if (modalOpen()) {
    if (modalStack.length) {
      document.getElementById("modal").innerHTML = modalStack.pop();
      updateBackBtn();
      return true;
    }
    if (window.__modalDismissible !== false) {
      closeModal();
      return true;
    }
    return true; // mandatory scoring modal — Back is ignored until answered
  }
  // 2) Return to the correct previous screen (not always home).
  if (navStack.length) {
    state.screen = navStack.pop();
    save();
    render();
    return true;
  }
  // 3) At the root — protect an active match: go to scoring instead of exiting.
  if (state.innings[0] && !state.result && state.screen !== "score") {
    state.screen = "score";
    save();
    render();
    return true;
  }
  return false;
}

function maybeOfferRecovery() {
  // Recoverable match = live match state restored from persistent storage.
  if (!state.innings[0] || state.result) return;
  const li = state.innings[state.inningsIndex || 0];
  if (!li) return;
  showModal(
    "<h2>🔄 Active Match Restored</h2>" +
    '<div class="banner">An unfinished match was recovered from saved data. Nothing is lost.</div>' +
    '<div class="result-banner"><div class="big">' + esc(state.match.team1) + " vs " + esc(state.match.team2) + '</div><div class="small">' +
    esc(li.battingTeam) + " " + li.runs + "/" + li.wickets + " (" + oversStr(li.legalBalls) + " ov)" + (li.target ? " • Target " + li.target : "") + " • " + esc(state.match.matchId) +
    "</div></div>" +
    '<button class="btn green block" style="font-size:calc(16px * var(--text-scale, 1));padding:15px" onclick="closeModal();go(\'score\')">▶️ Resume Match</button>' +
    '<button class="btn ghost block" style="margin-top:10px" onclick="closeModal();go(\'setup\')">Later — keep it saved</button>',
    false
  );
}

function initAppLifecycle() {
  // Android/system Back button support + automatic persistence hooks.
  try {
    if (history && history.pushState) {
      history.pushState({ cricketApp: true }, "");
      window.addEventListener("popstate", function () {
        const handled = goBack();
        if (handled) {
          try { history.pushState({ cricketApp: true }, ""); } catch (e) {}
        } else if (state.innings[0] && !state.result) {
          // accidental exit protection for an active match
          try { history.pushState({ cricketApp: true }, ""); } catch (e) {}
          toast("Match in progress — it is auto-saved. Use Pause to leave safely.");
        }
      });
    }
  } catch (e) {}
  try {
    if (window.addEventListener) {
      window.addEventListener("beforeunload", function (e) {
        save();
        if (state.innings[0] && !state.result) {
          e.preventDefault();
          e.returnValue = "";
          return "";
        }
      });
      window.addEventListener("pagehide", function () { save(); });
    }
  } catch (e) {}
  try {
    if (document.addEventListener) {
      document.addEventListener("visibilitychange", function () {
        if (document.hidden) save();
      });
    }
  } catch (e) {}
}

function render() {
  save(); // automatic persistence on every render (covers all scoring actions)
  const main = document.getElementById("main");
  const tabs = document.getElementById("tabs");
  const hdr = document.getElementById("hdrAvatar");
  if (hdr) {
    if (state.user.signedIn) {
      hdr.innerHTML = state.user.photo
        ? '<img src="' + esc(state.user.photo) + '" alt="">'
        : esc(state.user.avatarEmoji || avatarEmoji(state.user.name));
    } else {
      hdr.innerHTML = "👤";
    }
  }
  if (!state.user.signedIn && state.screen === "auth") {
    tabs.style.display = "none";
    main.innerHTML = authHTML();
    updateBackBtn();
    return;
  }
  tabs.style.display = "flex";
  ["score", "card", "tournament", "players", "profile"].forEach(function (s) {
    const el = document.getElementById("tab-" + s);
    if (el) el.classList.toggle("active", state.screen === s);
  });
  if (state.screen === "score") main.innerHTML = scoreHTML();
  else if (state.screen === "card") main.innerHTML = cardHTML();
  else if (state.screen === "tournament") main.innerHTML = tournamentHTML();
  else if (state.screen === "players") main.innerHTML = playersHTML();
  else if (state.screen === "profile") { try { main.innerHTML = profileHTML(); } catch (e) { main.innerHTML = '<div class="card"><h2>⚠️ Settings</h2><div class="banner amber">Settings could not load. The error details are below — take a screenshot if you need support.</div><div class="muted" style="margin-top:10px;white-space:pre-wrap;word-break:break-all;font-size:12px;background:#1a0a0a;padding:12px;border:1px solid #5a2020;border-radius:10px">' + esc(e && e.message ? e.message : String(e)) + '\n' + esc(e && e.stack ? e.stack.split('\n').slice(0, 5).join('\n') : '') + '</div></div>'; console.error('profileHTML error:', e); } }
  else if (state.screen === "auth") main.innerHTML = authHTML();
  else main.innerHTML = setupHTML();
  updateBackBtn();
}

  }

function projected(inn) {
  if (!inn.legalBalls) return "0";
  const total = state.match.oversLimit * 6;
  return String(Math.round((inn.runs / inn.legalBalls) * total));
}
function totalExtras(inn) {
  return inn.extras.wd + inn.extras.nb + inn.extras.b + inn.extras.lb;
}

/* ---------- SCORECARD SCREEN ---------- */
function cardHTML() {
  let html = "";
  if (state.result) {
    html += '<div class="result-banner"><div class="big">🏆 ' + esc(state.result.headline) + '</div><div class="small">' + esc(state.result.sub) + "</div></div>";
    if (state.lastPotm) {
      html += '<div class="banner">🏆 <b>Player of the Match:</b> ' + esc(state.lastPotm.name) + " — " + esc(state.lastPotm.note) + "</div>";
    }
  }

  for (let idx = 0; idx < 2; idx++) {
    const inn = state.innings[idx];
    if (!inn) continue;
    html += '<div class="card">';
    html += "<h2>" + (idx === 0 ? "1st" : "2nd") + " Innings — " + esc(inn.battingTeam) + " " + inn.runs + "/" + inn.wickets + " (" + oversStr(inn.legalBalls) + ")</h2>";

    html += '<table><tr><th>Batter</th><th></th><th class="num">R</th><th class="num">B</th><th class="num">4s</th><th class="num">6s</th><th class="num">Dots</th><th class="num">SR</th></tr>';
    inn.batters.forEach(function (b) {
      if (b.status === "didnotbat") return;
      const statusHtml = b.status === "out"
        ? '<div class="out-txt">' + esc(b.how) + "</div>"
        : '<div class="out-txt" style="color:#86efac">not out</div>';
      html += '<tr><td><div class="bat-name">' + esc(b.name) + "</div>" + statusHtml + "</td>" +
        '<td></td><td class="num"><b>' + b.runs + '</b></td><td class="num">' + b.balls + '</td><td class="num">' + b.fours + '</td><td class="num">' + b.sixes + '</td><td class="num">' + (b.dots || 0) + '</td><td class="num">' + strikeRate(b) + "</td></tr>";
    });
    const ex = inn.extras;
    html += '<tr><td colspan="2" class="muted">Extras (wd ' + ex.wd + ", nb " + ex.nb + ", b " + ex.b + ", lb " + ex.lb + ")</td>" +
      '<td class="num"><b>' + totalExtras(inn) + "</b></td><td colspan=\"4\"></td></tr>";
    html += '<tr><td colspan="2"><b>Total</b></td><td class="num"><b>' + inn.runs + "/" + inn.wickets + '</b></td><td colspan="4" class="muted">' + oversStr(inn.legalBalls) + " ov • RR " + crr(inn) + "</td></tr>";
    html += "</table>";

    if (inn.fow.length) {
      html += "<h3>Fall of Wickets</h3>";
      inn.fow.forEach(function (f) {
        html += '<div class="fow-line">' + f.runs + "-" + f.wickets + " (" + esc(f.batter) + ", " + f.over + " ov)</div>";
      });
    }

    if (inn.bowlers.length) {
      html += "<h3>Bowling</h3>";
      html += '<table><tr><th>Bowler</th><th class="num">O</th><th class="num">B</th><th class="num">M</th><th class="num">R</th><th class="num">W</th><th class="num">Dots</th><th class="num">WD</th><th class="num">NB</th></tr>';
      inn.bowlers.forEach(function (b) {
        html += "<tr><td>" + esc(b.name) + '</td><td class="num">' + oversStr(b.balls) + '</td><td class="num">' + b.balls + '</td><td class="num">' + b.maidens + '</td><td class="num">' + b.runs + '</td><td class="num"><b>' + b.wickets + '</b></td><td class="num">' + (b.dots || 0) + '</td><td class="num">' + (b.wd || 0) + '</td><td class="num">' + (b.nb || 0) + "</td></tr>";
      });
      html += "</table>";
    }

    html += "<h3>Ball by Ball</h3>";
    const overMap = {};
    const overOrder = [];
    inn.timeline.forEach(function (t) {
      const ov = t.over.split(".")[0];
      if (!overMap[ov]) { overMap[ov] = []; overOrder.push(ov); }
      overMap[ov].push(t.chip);
    });
    overOrder.forEach(function (ov) {
      html += '<div class="fow-line"><b>Over ' + (parseInt(ov, 10) + 1) + ":</b> " + overMap[ov].join("  ") + "</div>";
    });
    if (inn.target) {
      html += '<div class="banner amber" style="margin-top:10px">🎯 Target: <b>' + inn.target + " runs</b></div>";
    }
    html += "</div>";
  }

  html +=
    '<div class="card"><h2>📥 Share / Download</h2>' +
    '<div class="row2">' +
    '<button class="btn green" onclick="downloadScorecard()">⬇️ Text File</button>' +
    '<button class="btn blue" onclick="copyScore()">📋 Copy Score</button>' +
    "</div>" +
    '<button class="btn ghost block" style="margin-top:10px" onclick="go(\'score\')">🎯 Back to Scoring</button>' +
    "</div>";

  return html;
}

function tournamentHTML() {
  const hist = state.matchHistory || [];
  const rows = computePointsTable();
  const career = computeCareerStats();
  const players = Object.keys(career).map(function (k) { return career[k]; });

  const topRuns = players.slice().sort(function (a, b) { return b.runs - a.runs || b.hs - a.hs; })
    .filter(function (p) { return p.runs > 0 || p.balls > 0; }).slice(0, 8);
  const topWkts = players.slice().sort(function (a, b) { return b.wkts - a.wkts || a.oruns - b.oruns; })
    .filter(function (p) { return p.wkts > 0; }).slice(0, 8);
  const topPotm = players.filter(function (p) { return p.potm > 0; })
    .sort(function (a, b) { return b.potm - a.potm; }).slice(0, 8);

  let html = '<div class="banner">🏆 <b>History</b> — every saved match, teams &amp; player statistics. All stats are calculated from real match data!</div>';

  // ===== Active & Paused matches (resume) — never counted as completed =====
  html += '<div class="card"><h2>⏯️ Active &amp; Paused Matches</h2>';
  window.__resumeRows = [];
  const liveMatch = state.innings[0] && !state.result;
  if (liveMatch) {
    const li = state.innings[state.inningsIndex || 0];
    window.__resumeRows.push({ type: "live", matchId: state.match.matchId });
    html += '<div class="team-row" style="cursor:pointer" onclick="resumeFromHistory(' + (window.__resumeRows.length - 1) + ')">' +
      teamLogoHtml(state.match.team1, "md") +
      '<div class="grow"><div class="bat-name">' + esc(state.match.team1) + " vs " + esc(state.match.team2) + "</div>" +
      '<div class="kv">In Progress • ' + esc(li.battingTeam) + " " + li.runs + "/" + li.wickets + " (" + oversStr(li.legalBalls) + " ov)" + (li.target ? " • Target " + li.target : "") + "</div></div>" +
      '<span class="badge green">▶ Resume</span></div>';
  }
  (state.pausedMatches || []).forEach(function (pm) {
    const i0 = pm.innings && pm.innings[pm.inningsIndex || 0] ? pm.innings[pm.inningsIndex || 0] : pm.innings[0];
    window.__resumeRows.push({ type: "paused", matchId: pm.matchId });
    html += '<div class="team-row" style="cursor:pointer" onclick="resumeFromHistory(' + (window.__resumeRows.length - 1) + ')">' +
      teamLogoHtml(pm.match.team1, "md") +
      '<div class="grow"><div class="bat-name">' + esc(pm.match.team1) + " vs " + esc(pm.match.team2) + "</div>" +
      '<div class="kv">Paused • ' + (i0 ? esc(i0.battingTeam) + " " + i0.runs + "/" + i0.wickets + " (" + oversStr(i0.legalBalls) + " ov)" : "") + " • ID " + esc(String(pm.matchId)) + "</div></div>" +
      '<span class="badge amber">▶ Resume</span></div>';
  });
  if (!window.__resumeRows.length) {
    html += '<div class="muted">No active or paused matches right now.</div>';
  }
  html += '<div class="muted" style="margin-top:6px">Unfinished matches are never counted in statistics until they are completed.</div></div>';

  html += '<div class="card"><h2>📊 Points Table</h2>';
  html += '<table><tr><th>Team</th><th class="num">P</th><th class="num">W</th><th class="num">L</th><th class="num">T</th><th class="num">Pts</th><th class="num">NRR</th></tr>';
  rows.forEach(function (t) {
    const nrrStr = (t.nrr >= 0 ? "+" : "") + t.nrr.toFixed(2);
    html += '<tr><td><div class="flex">' + teamLogoHtml(t.name) + "<b>" + esc(t.name) + '</b></div></td><td class="num">' + t.p + '</td><td class="num">' + t.w + '</td><td class="num">' + t.l + '</td><td class="num">' + t.t + '</td><td class="num"><b>' + t.pts + '</b></td><td class="num">' + nrrStr + "</td></tr>";
  });
  html += "</table>";
  if (!hist.length) html += '<div class="muted" style="margin-top:8px">No match completed yet — points appear after the first match.</div>';
  html += '<div class="muted" style="margin-top:6px">Win = 2 pts • Tie = 1 pt • NRR (simplified) = run rate for − against</div></div>';

  // ===== Teams section (team-wise history) =====
  html += '<div class="card"><h2>🛡️ Teams</h2>';
  const teamNameSet = {};
  const seenTeamMatches = {};
  hist.forEach(function (m) {
    const mk = String(m.matchId != null ? m.matchId : m.id);
    if (seenTeamMatches[mk]) return;
    seenTeamMatches[mk] = true;
    teamNameSet[m.team1] = true;
    teamNameSet[m.team2] = true;
  });
  if (state.match) { teamNameSet[state.match.team1] = true; teamNameSet[state.match.team2] = true; }
  window.__histTeamRows = [];
  const teamNameList = Object.keys(teamNameSet);
  if (!teamNameList.length) {
    html += '<div class="muted">No teams yet — complete a match and teams will appear here.</div>';
  } else {
    teamNameList.forEach(function (tn) {
      const tq = computeTeamStats(tn);
      window.__histTeamRows.push(tn);
      const idx = window.__histTeamRows.length - 1;
      html += '<div class="team-row" style="cursor:pointer" onclick="openHistTeam(' + idx + ')">' +
        teamLogoHtml(tn, "md") +
        '<div class="grow"><div class="bat-name">' + esc(tn) + "</div>" +
        '<div class="kv">' + tq.p + " played • " + tq.w + "W " + tq.l + "L " + tq.t + "T • " + tq.runsFor + " runs • " + tq.wktsTaken + " wkts</div></div>" +
        '<span class="badge green">History</span></div>';
    });
  }
  html += '<div class="muted" style="margin-top:6px">Tap a team for its full statistics, players and match history.</div></div>';

  html += '<div class="card"><h2>🗂️ Match History (' + hist.length + ')</h2><div class="muted" style="margin-bottom:6px">✅ Completed matches — tap for the full scoreboard (read-only).</div>';
  if (!hist.length) {
    html += '<div class="muted">No matches saved yet. Finished matches appear here — tap to view the full scorecard.</div>';
  } else {
    hist.forEach(function (m) {
      html += '<button class="btn gray block" style="margin-bottom:8px;justify-content:space-between;text-align:left" onclick="openHistoryModal(' + m.id + ')">' +
        "<span><b>" + esc(m.team1) + " vs " + esc(m.team2) + '</b><br><span class="muted">' + esc(m.date) + " • " + esc(m.result.headline) + "</span></span>" +
        '<span class="badge green">View</span></button>';
    });
  }
  html += "</div>";

  html += '<div class="card"><h2>🏏 Player Career Stats</h2>';
  if (!players.length) {
    html += '<div class="muted">Complete a match to see player career stats here.</div>';
  } else {
    if (topRuns.length) {
      html += "<h3>Most Runs</h3>";
      html += '<table><tr><th>Player</th><th class="num">M</th><th class="num">Runs</th><th class="num">HS</th><th class="num">4s</th><th class="num">6s</th><th class="num">SR</th></tr>';
      window.__statNames = window.__statNames || {};
      topRuns.forEach(function (p, i) {
        const pr = getPlayer(p.name);
        window.__statNames["r" + i] = p.name;
        html += '<tr style="cursor:pointer" onclick="openPlayerProfileByIndex(\'r\', ' + i + ')"><td><div class="flex">' + avatarHtml(p.name, pr.photo) + "<b>" + esc(p.name) + "</b></div></td><td class=\"num\">" + p.mat + '</td><td class="num"><b>' + p.runs + '</b></td><td class="num">' + p.hs + '</td><td class="num">' + p.fours + '</td><td class="num">' + p.sixes + '</td><td class="num">' + (p.balls ? ((p.runs / p.balls) * 100).toFixed(1) : "0.0") + "</td></tr>";
      });
      html += "</table>";
    }
    if (topWkts.length) {
      html += "<h3>Most Wickets</h3>";
      html += '<table><tr><th>Player</th><th class="num">M</th><th class="num">O</th><th class="num">W</th><th class="num">Best</th><th class="num">Econ</th></tr>';
      topWkts.forEach(function (p, i) {
        const pr = getPlayer(p.name);
        window.__statNames["w" + i] = p.name;
        html += '<tr style="cursor:pointer" onclick="openPlayerProfileByIndex(\'w\', ' + i + ')"><td><div class="flex">' + avatarHtml(p.name, pr.photo) + "<b>" + esc(p.name) + "</b></div></td><td class=\"num\">" + p.mat + '</td><td class="num">' + oversStr(p.oballs) + '</td><td class="num"><b>' + p.wkts + '</b></td><td class="num">' + p.bestW + "/" + p.bestR + '</td><td class="num">' + (p.oballs ? (p.oruns / (p.oballs / 6)).toFixed(2) : "0.00") + "</td></tr>";
      });
      html += "</table>";
    }
    if (topPotm.length) {
      html += "<h3>🏆 Player of the Match Awards</h3>";
      topPotm.forEach(function (p) {
        html += '<div class="fow-line">🏆 <b>' + esc(p.name) + "</b> — " + p.potm + " award" + (p.potm > 1 ? "s" : "") + "</div>";
      });
    }
  }
  html += "</div>";

  html += '<div class="card"><h2>📥 Export</h2>' +
    '<div class="row2">' +
    '<button class="btn blue" onclick="downloadHistory()">⬇️ Tournament Report</button>' +
    '<button class="btn ghost" onclick="go(\'score\')">🎯 Scoring</button>' +
    "</div></div>";

  return html;
}

function downloadHistory() {
  const hist = state.matchHistory || [];
  let s = "======================================\n  TOURNAMENT REPORT\n  Matches: " + hist.length + "\n======================================\n\n";
  s += "POINTS TABLE\n------------\n";
  computePointsTable().forEach(function (t, i) {
    s += (i + 1) + ". " + t.name + "  P:" + t.p + " W:" + t.w + " L:" + t.l + " T:" + t.t + " Pts:" + t.pts + " NRR:" + (t.nrr >= 0 ? "+" : "") + t.nrr.toFixed(2) + "\n";
  });
  s += "\nMATCHES\n-------\n";
  hist.forEach(function (m, i) {
    s += (i + 1) + ". " + m.team1 + " vs " + m.team2 + " (" + m.date + ")\n   " + m.result.headline + "\n";
    m.innings.forEach(function (inn) {
      s += "   " + inn.battingTeam + ": " + inn.runs + "/" + inn.wickets + " (" + oversStr(inn.balls) + ")\n";
    });
    if (m.potm) s += "   POTM: " + m.potm.name + " (" + m.potm.note + ")\n";
    s += "\n";
  });
  const blob = new Blob([s], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "tournament-report.txt";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("Tournament report downloaded!");
}

function addPlayerSuggest() {
  const el = document.getElementById("npName");
  const box = document.getElementById("npSuggest");
  if (!el || !box) return;
  const q = (el.value || "").trim();
  if (!q) { box.innerHTML = ""; return; }
  const list = playerSuggestions(q, 6);
  window.__npNames = list;
  let html = list.map(function (n, i) {
    return '<div class="fow-line" style="cursor:pointer" onclick="npPickSuggest(' + i + ')">👤 ' + esc(n) + "</div>";
  }).join("");
  const exact = state.playerDB[nameKey(q)];
  if (exact) {

function playerShotMapHtml(name) {
  const cs = computeCareerStats();
  const st = cs[name] || { shots: {} };
  const shots = st.shots || {};
  let totalShots = 0, totalRuns = 0, fav = null, favN = 0;
  Object.keys(shots).forEach(function (k) {
    const v = shots[k];
    totalShots += v.n;
    totalRuns += v.runs;
    if (v.n > favN) { favN = v.n; fav = parseInt(k, 10); }
  });
  if (!totalShots) {
    return '<div class="muted">No shot data yet. During scoring, tap the ground chart after each shot to build the wagon wheel!</div>';
  }
  let rows = "";
  for (let i = 0; i < 8; i++) {
    const v = shots[i] || { n: 0, runs: 0 };
    rows += "<tr><td>" + sectorName(i) + '</td><td class="num">' + v.n + '</td><td class="num">' + v.runs + "</td></tr>";
  }
  return groundSvgAnalytics(shots) +
    '<div class="banner" style="margin-top:10px">📍 <b>Favourite area:</b> ' + sectorName(fav) + " — " + favN + " shot(s). Total " + totalShots + " shots, " + totalRuns + " runs mapped.</div>" +
    '<table style="margin-top:6px"><tr><th>Area</th><th class="num">Shots</th><th class="num">Runs</th></tr>' + rows + "</table>";
}

  // update name inside current match + history is kept as recorded (historical integrity)

function computeTeamStats(teamName) {
  const seenMatches = {};
  let p = 0, w = 0, l = 0, t = 0, nr = 0;
  let runsFor = 0, runsAgainst = 0, wktsTaken = 0, wktsLost = 0, bf = 0, ba = 0;
  let hs = -1, hsStr = "—";
  (state.matchHistory || []).forEach(function (m) {
    const mk = String(m.matchId != null ? m.matchId : m.id);
    if (seenMatches[mk]) return;
    seenMatches[mk] = true;
    if (m.team1 !== teamName && m.team2 !== teamName) return;
    p++;
    if (m.winner === teamName) w++;
    else if (m.winner === "tie") t++;
    else if (m.winner) l++;
    else nr++;
    (m.innings || []).forEach(function (inn) {
      if (inn.battingTeam === teamName) {
        runsFor += inn.runs; wktsLost += inn.wickets; bf += inn.balls;
        if (inn.runs > hs) { hs = inn.runs; hsStr = inn.runs + "/" + inn.wickets; }
      } else if (inn.bowlingTeam === teamName) {
        runsAgainst += inn.runs; wktsTaken += inn.wickets; ba += inn.balls;
      }
    });
  });
  return {
    p: p, w: w, l: l, t: t, nr: nr,
    winPct: p ? Math.round((w / p) * 100) : 0,
    runsFor: runsFor, runsAgainst: runsAgainst,
    wktsTaken: wktsTaken, wktsLost: wktsLost,
    hs: hsStr, bf: bf, ba: ba
  };
}

function computeTeamPlayers(teamName) {
  const P = {};
  const seenMatches = {};
  function pl(name) {
    if (!P[name]) P[name] = {
      name: name, matches: 0, inns: 0, runs: 0, balls: 0, fours: 0, sixes: 0, hs: 0, notOuts: 0,
      oballs: 0, oruns: 0, wkts: 0, maidens: 0,
      catches: 0, runOuts: 0, stumpings: 0
    };
    return P[name];
  }
  (state.matchHistory || []).forEach(function (m) {
    const mk = String(m.matchId != null ? m.matchId : m.id);
    if (seenMatches[mk]) return;
    seenMatches[mk] = true;
    if (m.team1 !== teamName && m.team2 !== teamName) return;
    const appeared = {};
    (m.innings || []).forEach(function (inn) {
      if (inn.battingTeam === teamName) {
        (inn.batters || []).forEach(function (b) {
          const q = pl(b.name);
          q.inns++; q.runs += b.runs; q.balls += b.balls; q.fours += b.fours; q.sixes += b.sixes;
          if (b.runs > q.hs) q.hs = b.runs;
          if (b.status !== "out") q.notOuts++;
          appeared[b.name] = true;
        });
      }
      if (inn.bowlingTeam === teamName) {
        (inn.bowlers || []).forEach(function (b) {
          const q = pl(b.name);
          q.oballs += b.balls; q.oruns += b.runs; q.wkts += b.wickets; q.maidens += b.maidens;
          appeared[b.name] = true;
        });
        (inn.wicketsList || []).forEach(function (wv) {
          if (wv.type === "Caught & Bowled" && wv.bowler) {
            pl(wv.bowler).catches++;
            appeared[wv.bowler] = true;
          } else if (wv.fielder) {
            if (wv.type === "Caught") pl(wv.fielder).catches++;
            else if (wv.type === "Stumped") pl(wv.fielder).stumpings++;
            else if (wv.type === "Run Out") pl(wv.fielder).runOuts++;
            if (wv.type === "Caught" || wv.type === "Stumped" || wv.type === "Run Out") appeared[wv.fielder] = true;
          }
        });
      }
    });
    Object.keys(appeared).forEach(function (k) { pl(k).matches++; });
  });
  return P;
}

function startMatch() {
  const t1 = (document.getElementById("t1").value || "Team A").trim();
  const t2 = (document.getElementById("t2").value || "Team B").trim();
  const overs = parseInt(document.getElementById("overs").value, 10);
  const firstBat = document.getElementById("firstBat").value;

  ensureTeam(t1); ensureTeam(t2);
  // register selected players into universal pool
  state.match.players1.forEach(function (n) { ensurePlayer(n); });
  state.match.players2.forEach(function (n) { ensurePlayer(n); });

  const hist = state.matchHistory || [];
  const settings = state.settings;
  const user = state.user;
  const playerDB = state.playerDB;
  const teamDB = state.teamDB;
  const sync = state.sync;

  const p1 = state.match.players1.slice();
  const p2 = state.match.players2.slice();
  // any number of players per team (even 0) — names can be entered when the
  // app asks for opening batsmen / bowler; no players are auto-created here

  // never lose an unfinished live match — keep it as a paused record first
  const liveSnap = snapshotLiveMatch();
  if (liveSnap) upsertPaused(liveSnap);
  const paused = state.pausedMatches || [];

  state = defaultState();
  state.matchHistory = hist;
  state.settings = settings;
  state.user = user;
  state.playerDB = playerDB;
  state.teamDB = teamDB;
  state.sync = sync;
  state.pausedMatches = paused;
  state.match = {
    matchId: newMatchId(),
    team1: t1, team2: t2,
    oversLimit: isNaN(overs) || overs <= 0 ? 20 : overs,
    players1: p1, players2: p2,
    firstBat: firstBat
  };
  state.innings[0] = newInningsObj(firstBat, null);
  state.inningsIndex = 0;
  state.screen = "score";
  undoStack = [];
  pendingExtra = null;
  save();
  render();
  openInningsStartModal();
}

function newMatchFromResult() {
  closeModal();
