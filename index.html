<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="version" content="v1792002623">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>🏏 Cricket Scorer — Live Scoring Board</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans", Arial, sans-serif;
    background: #0b1220; color: #e8eef7;
    max-width: 520px; margin: 0 auto; min-height: 100%;
    display: flex; flex-direction: column; overscroll-behavior: contain;
  }
  header {
    background: linear-gradient(135deg, #0e3b2c, #14532d 55%, #166534);
    padding: 12px 14px 10px; display: flex; align-items: center; gap: 10px;
    position: sticky; top: 0; z-index: 20; box-shadow: 0 4px 18px rgba(0,0,0,.45);
  }
  header .logo { font-size: calc(26px * var(--text-scale, 1)); }
  header h1 { font-size: calc(15.5px * var(--text-scale, 1)); font-weight: 800; letter-spacing: .2px; }
  header .sub { font-size: calc(10.5px * var(--text-scale, 1)); opacity: .85; font-weight: 500; }
  header .hdr-right { margin-left: auto; }
  .avatar {
    width: 38px; height: 38px; border-radius: 50%; border: 2px solid rgba(255,255,255,.5);
    background: #1e293b; display: flex; align-items: center; justify-content: center;
    font-size: calc(18px * var(--text-scale, 1)); overflow: hidden; cursor: pointer; flex-shrink: 0;
  }
  .avatar img { width: 100%; height: 100%; object-fit: cover; }
  .avatar.lg { width: 76px; height: 76px; font-size: calc(36px * var(--text-scale, 1)); }
  .avatar.md { width: 52px; height: 52px; font-size: calc(25px * var(--text-scale, 1)); }
  main { flex: 1; padding: 12px 12px 84px; }

  .card { background: #121a2b; border: 1px solid #223049; border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  .card h2 { font-size: calc(13px * var(--text-scale, 1)); text-transform: uppercase; letter-spacing: .8px; color: #7dd3fc; margin-bottom: 10px; }
  .card h3 { font-size: calc(12.5px * var(--text-scale, 1)); color: #93c5fd; margin: 8px 0 6px; }

  label { display: block; font-size: calc(11.5px * var(--text-scale, 1)); color: #94a3b8; margin: 10px 0 4px; font-weight: 600; }
  input[type=text], input[type=number], input[type=email], select, textarea {
    width: 100%; background: #0b1220; border: 1px solid #2b3a55; color: #e8eef7;
    border-radius: 10px; padding: 10px 12px; font-size: calc(14px * var(--text-scale, 1)); outline: none;
  }
  input:focus, select:focus, textarea:focus { border-color: #22c55e; }
  textarea { min-height: 72px; resize: vertical; font-size: calc(12.5px * var(--text-scale, 1)); line-height: 1.5; }
  input[type=range] { width: 100%; accent-color: #22c55e; height: 28px; }

  .btn {
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    border: none; border-radius: 12px; cursor: pointer; font-weight: 700; font-size: calc(14px * var(--text-scale, 1));
    padding: 12px 16px; background: #1e293b; color: #e8eef7;
    transition: transform .06s ease, filter .15s; user-select: none;
  }
  .btn:active { transform: scale(.96); }
  .btn.green { background: linear-gradient(135deg, #16a34a, #15803d); color: #fff; }
  .btn.blue  { background: linear-gradient(135deg, #2563eb, #1d4ed8); color: #fff; }
  .btn.red   { background: linear-gradient(135deg, #dc2626, #b91c1c); color: #fff; }
  .btn.amber { background: linear-gradient(135deg, #d97706, #b45309); color: #fff; }
  .btn.gray  { background: #243147; color: #dbeafe; }
  .btn.ghost { background: transparent; border: 1px solid #334155; color: #cbd5e1; }
  .btn.block { width: 100%; }
  .btn.sm { padding: 8px 12px; font-size: calc(12.5px * var(--text-scale, 1)); border-radius: 10px; }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn.google { background: #fff; color: #1f2937; }
  .btn.google .g { font-weight: 900; color: #4285f4; font-size: calc(16px * var(--text-scale, 1)); }

  .chip-row { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid #334155; background: #16213a; color: #e2e8f0;
    border-radius: 999px; padding: 8px 14px; font-size: calc(13px * var(--text-scale, 1)); font-weight: 700; cursor: pointer;
    display: inline-flex; align-items: center; gap: 6px;
  }
  .chip.active { background: #16a34a; border-color: #22c55e; color: #fff; }
  .chip.small { padding: 5px 11px; font-size: calc(11.5px * var(--text-scale, 1)); }
  .chip.disabled { opacity: .35; cursor: not-allowed; }

  .score-hero {
    background: linear-gradient(150deg, #0f2f27, #123a2f 45%, #0c2a3d);
    border: 1px solid #24506b; border-radius: 16px; padding: 14px; margin-bottom: 12px;
  }
  .score-hero .inn-tag { font-size: calc(10.5px * var(--text-scale, 1)); font-weight: 800; letter-spacing: 1.2px; color: #7dd3fc; text-transform: uppercase; }
  .score-hero .team-line { display: flex; align-items: center; gap: 10px; margin: 6px 0 2px; }
  .score-hero .team-name { font-size: calc(17px * var(--text-scale, 1)); font-weight: 800; }
  .score-hero .score-big { font-size: calc(34px * var(--text-scale, 1)); font-weight: 900; letter-spacing: .5px; line-height: 1.05; margin-left: auto; }
  .score-hero .overs { font-size: calc(13px * var(--text-scale, 1)); color: #a5b4c8; font-weight: 600; margin-top: 2px; }
  .stat-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 12px; }
  .stat { background: rgba(255,255,255,.05); border: 1px solid rgba(255,255,255,.08); border-radius: 10px; padding: 8px 6px; text-align: center; }
  .stat .v { font-size: calc(15px * var(--text-scale, 1)); font-weight: 800; }
  .stat .l { font-size: calc(9.5px * var(--text-scale, 1)); color: #9db2c9; text-transform: uppercase; letter-spacing: .7px; margin-top: 2px; }

  table { width: 100%; border-collapse: collapse; font-size: calc(12px * var(--text-scale, 1)); }
  th, td { padding: 7px 5px; text-align: left; border-bottom: 1px solid #223049; }
  th { color: #7dd3fc; font-size: calc(10px * var(--text-scale, 1)); text-transform: uppercase; letter-spacing: .7px; }
  td.num, th.num { text-align: right; }
  .pos { color: #4ade80; font-weight: 800; margin-right: 4px; }
  .out-txt { color: #fca5a5; font-size: calc(10.5px * var(--text-scale, 1)); }
  .bat-name { font-weight: 700; font-size: calc(12.5px * var(--text-scale, 1)); }

  .over-strip { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .ball {
    width: 30px; height: 30px; border-radius: 50%; display: inline-flex;
    align-items: center; justify-content: center; font-size: calc(11px * var(--text-scale, 1)); font-weight: 800;
    background: #243147; color: #e2e8f0; border: 1px solid #3b4c6b;
  }
  .ball.r4 { background: #15803d; border-color: #22c55e; color: #fff; }
  .ball.r6 { background: #7c3aed; border-color: #a78bfa; color: #fff; }
  .ball.w  { background: #dc2626; border-color: #f87171; color: #fff; }
  .ball.ex { background: #b45309; border-color: #f59e0b; color: #fff; }
  .ball.dot { background: #1f2937; }

  .keypad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
  .key {
    padding: 15px 0; border-radius: 14px; border: 1px solid #334155;
    background: linear-gradient(180deg, #1e293b, #172033); color: #f1f5f9;
    font-size: calc(19px * var(--text-scale, 1)); font-weight: 900; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center; transition: transform .06s;
  }
  .key:active { transform: scale(.95); }
  .key small { font-size: calc(8.5px * var(--text-scale, 1)); font-weight: 700; color: #94a3b8; letter-spacing: .4px; margin-top: 2px; }
  .key.k4 { background: linear-gradient(180deg, #166534, #14532d); border-color: #22c55e; }
  .key.k6 { background: linear-gradient(180deg, #6d28d9, #5b21b6); border-color: #a78bfa; }
  .key.kout { background: linear-gradient(180deg, #b91c1c, #991b1b); border-color: #f87171; }
  .key.kwd { background: linear-gradient(180deg, #b45309, #92400e); border-color: #fbbf24; font-size: calc(15px * var(--text-scale, 1)); }
  .key.knb { background: linear-gradient(180deg, #c2410c, #9a3412); border-color: #fdba74; font-size: calc(15px * var(--text-scale, 1)); }
  .key.kun { background: linear-gradient(180deg, #334155, #1e293b); border-color: #64748b; font-size: calc(13px * var(--text-scale, 1)); }

  .pending-box { background: #1a2438; border: 1px dashed #fbbf24; border-radius: 12px; padding: 10px; margin-bottom: 10px; }
  .pending-box .t { font-size: calc(11.5px * var(--text-scale, 1)); color: #fbbf24; font-weight: 700; margin-bottom: 8px; }

  nav.tabs {
    position: fixed; bottom: 0; left: 0; right: 0; max-width: 520px; margin: 0 auto;
    background: #0d1526; border-top: 1px solid #223049; display: flex; z-index: 30;
  }
  nav.tabs button {
    flex: 1; background: none; border: none; color: #7c8aa0; padding: 9px 0 11px;
    font-size: calc(9px * var(--text-scale, 1)); font-weight: 700; display: flex; flex-direction: column; align-items: center; gap: 3px; cursor: pointer;
  }
  nav.tabs button .ic { font-size: calc(17px * var(--text-scale, 1)); }
  nav.tabs button.active { color: #4ade80; }

  .modal-wrap {
    position: fixed; inset: 0; background: rgba(2,6,16,.72);
    display: flex; align-items: flex-end; justify-content: center; z-index: 100; backdrop-filter: blur(3px);
  }
  .modal-wrap.center { align-items: center; padding: 16px; }
  .modal {
    background: #131c2e; width: 100%; max-width: 520px; border-radius: 18px 18px 0 0;
    padding: 16px 14px 22px; border: 1px solid #2b3a55; max-height: 88vh; overflow-y: auto;
  }
  .modal-wrap.center .modal { border-radius: 18px; }
  .modal h2 { font-size: calc(15px * var(--text-scale, 1)); margin-bottom: 10px; color: #f8fafc; }
  .modal .hint { font-size: calc(11px * var(--text-scale, 1)); color: #94a3b8; margin-bottom: 10px; line-height: 1.5; }
  .hidden { display: none !important; }

  .result-banner {
    background: linear-gradient(135deg, #14532d, #166534); border-radius: 14px;
    padding: 18px 14px; text-align: center; border: 1px solid #22c55e; margin-bottom: 12px;
  }
  .result-banner .big { font-size: calc(19px * var(--text-scale, 1)); font-weight: 900; }
  .result-banner .small { font-size: calc(12px * var(--text-scale, 1)); opacity: .9; margin-top: 6px; }
  .banner {
    background: #172033; border-left: 4px solid #22c55e; padding: 10px 12px;
    border-radius: 8px; font-size: calc(12px * var(--text-scale, 1)); color: #cbd5e1; margin-bottom: 12px; line-height: 1.55;
  }
  .banner.amber { border-left-color: #f59e0b; }
  .banner.blue { border-left-color: #3b82f6; }
  .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .row3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .muted { color: #94a3b8; font-size: calc(11.5px * var(--text-scale, 1)); line-height: 1.6; }
  .fow-line { font-size: calc(11px * var(--text-scale, 1)); color: #94a3b8; padding: 4px 0; border-bottom: 1px dashed #223049; }
  .divider { height: 1px; background: #223049; margin: 12px 0; }
  .flex { display: flex; gap: 8px; align-items: center; }
  .flex .grow { flex: 1; }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: calc(9.5px * var(--text-scale, 1)); font-weight: 800; letter-spacing: .5px;
  }
  .badge.green { background: #14532d; color: #86efac; }
  .badge.blue { background: #1e3a5f; color: #93c5fd; }
  .badge.amber { background: #78350f; color: #fcd34d; }
  .badge.red { background: #7f1d1d; color: #fecaca; }

  /* player grid */
  .player-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .player-card {
    background: #172033; border: 1px solid #2b3a55; border-radius: 12px;
    padding: 10px 6px; text-align: center; cursor: pointer;
  }
  .player-card .nm { font-size: calc(10.5px * var(--text-scale, 1)); font-weight: 700; margin-top: 6px; word-break: break-word; }
  .player-card .st { font-size: calc(8.5px * var(--text-scale, 1)); color: #94a3b8; margin-top: 2px; }
  .player-card.selected { border-color: #22c55e; background: #122b1c; }
  .emoji-grid { display: flex; flex-wrap: wrap; gap: 6px; }
  .emoji-opt {
    width: 42px; height: 42px; border-radius: 10px; background: #1e293b;
    border: 1px solid #334155; display: flex; align-items: center; justify-content: center;
    font-size: calc(21px * var(--text-scale, 1)); cursor: pointer;
  }
  .emoji-opt.active { border-color: #22c55e; background: #122b1c; }

  .auth-hero {
    text-align: center; padding: 26px 14px 18px;
    background: linear-gradient(160deg, #0f2f27, #123a2f 55%, #0c2a3d);
    border: 1px solid #24506b; border-radius: 16px; margin-bottom: 12px;
  }
  .auth-hero .big-logo { font-size: calc(52px * var(--text-scale, 1)); }
  .auth-hero h2 { font-size: calc(19px * var(--text-scale, 1)); margin: 10px 0 6px; color: #fff; letter-spacing: .2px; }
  .auth-hero p { font-size: calc(12px * var(--text-scale, 1)); color: #a5b4c8; line-height: 1.6; }

  .photo-btn {
    display: inline-flex; align-items: center; gap: 6px; background: #1e293b;
    border: 1px solid #334155; color: #cbd5e1; border-radius: 10px;
    padding: 8px 12px; font-size: calc(11.5px * var(--text-scale, 1)); font-weight: 700; cursor: pointer;
  }
  .seg { display: flex; background: #0b1220; border: 1px solid #2b3a55; border-radius: 10px; overflow: hidden; }
  .seg button {
    flex: 1; background: none; border: none; color: #94a3b8; padding: 9px 6px;
    font-size: calc(11.5px * var(--text-scale, 1)); font-weight: 700; cursor: pointer;
  }
  .seg button.active { background: #16a34a; color: #fff; }
  .switch-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 9px 0; border-bottom: 1px solid #1c2a42; font-size: calc(12.5px * var(--text-scale, 1)); font-weight: 600;
  }
  .switch {
    width: 44px; height: 24px; border-radius: 999px; background: #334155;
    position: relative; cursor: pointer; transition: background .15s; flex-shrink: 0;
  }
  .switch::after {
    content: ""; position: absolute; top: 3px; left: 3px; width: 18px; height: 18px;
    border-radius: 50%; background: #fff; transition: left .15s;
  }
  .switch.on { background: #16a34a; }
  .switch.on::after { left: 23px; }
  .team-row { display: flex; align-items: center; gap: 10px; padding: 8px 0; border-bottom: 1px solid #1c2a42; }
  .team-row .grow { flex: 1; }
  .kv { font-size: calc(11px * var(--text-scale, 1)); color: #94a3b8; }
  .kv b { color: #e8eef7; font-size: calc(12px * var(--text-scale, 1)); }


/* ===== Appearance themes + button shapes (defaults = existing look) ===== */
:root {
  --th-bg: #0b1220; --th-card: #121a2b; --th-border: #223049;
  --th-text: #e8eef7; --th-muted: #94a3b8;
  --th-primary: #22c55e; --th-secondary: #2563eb; --th-accent: #7dd3fc;
  --th-btn: #1e293b; --th-btn-text: #e8eef7;
  --th-h2: #7dd3fc; --th-h3: #93c5fd;
  --th-input-bg: #0b1220; --th-input-border: #2b3a55;
  --th-chip-bg: #16213a; --th-chip-border: #334155;
  --th-nav-bg: #0d1526; --th-modal-bg: #131c2e; --th-banner-bg: #172033;
  --th-switch-on: #16a34a; --th-focus: #22c55e;
  --th-header-grad: linear-gradient(135deg, #0e3b2c, #14532d 55%, #166534);
  --th-green-grad: linear-gradient(135deg, #16a34a, #15803d);
  --th-blue-grad: linear-gradient(135deg, #2563eb, #1d4ed8);
  --th-hero-grad: linear-gradient(150deg, #0f2f27, #123a2f 45%, #0c2a3d);
  --th-auth-grad: linear-gradient(160deg, #0f2f27, #123a2f 55%, #0c2a3d);
  --shape-btn: 12px; --shape-card: 14px; --shape-input: 10px;
  --shape-chip: 999px; --shape-key: 14px; --shape-modal: 18px; --shape-badge: 999px;
}
body { background: var(--th-body-bg, var(--th-bg)) !important; color: var(--th-text) !important; }
body[data-icon-style="outline"] .badge { background: transparent !important; border: 1px solid currentColor; }
body[data-icon-style="soft"] .badge { background: var(--th-soft-badge, rgba(255,255,255,0.12)) !important; }
body[data-icon-style="outline"] .emoji-opt, body[data-icon-style="outline"] .th-dots i { background: transparent !important; }
body[data-icon-style="soft"] .emoji-opt { background: var(--th-soft-badge, #1e293b) !important; }
header { background: var(--th-header-grad) !important; }
.card { background: var(--th-card) !important; border-color: var(--th-border) !important; border-radius: var(--shape-card) !important; }
.card h2 { color: var(--th-h2) !important; }
.card h3 { color: var(--th-h3) !important; }
label { color: var(--th-muted) !important; }
.muted { color: var(--th-muted) !important; }
.kv { color: var(--th-muted) !important; }
.kv b { color: var(--th-text) !important; }
.fow-line { color: var(--th-muted) !important; border-color: var(--th-border) !important; }
.divider { background: var(--th-border) !important; }
input[type=text], input[type=number], input[type=email], select, textarea {
  background: var(--th-input-bg) !important; color: var(--th-text) !important;
  border-color: var(--th-input-border) !important; border-radius: var(--shape-input) !important;
}
input:focus, select:focus, textarea:focus { border-color: var(--th-focus) !important; }
input[type=range] { accent-color: var(--th-focus) !important; }
.btn {
  background: var(--th-btn) !important; color: var(--th-btn-text) !important;
  border-radius: var(--shape-btn) !important;
}
.btn.green { background: var(--th-green-grad) !important; color: #fff !important; }
.btn.blue { background: var(--th-blue-grad) !important; color: #fff !important; }
.btn.gray { background: var(--th-gray-btn, #2a3a54) !important; color: var(--th-text) !important; }
.btn.ghost { background: transparent !important; border: 1px solid var(--th-chip-border) !important; color: var(--th-text) !important; }
.btn.sm { border-radius: var(--shape-btn) !important; }
.chip {
  background: var(--th-chip-bg) !important; border-color: var(--th-chip-border) !important;
  color: var(--th-text) !important; border-radius: var(--shape-chip) !important;
}
.chip.active { background: var(--th-switch-on) !important; border-color: var(--th-primary) !important; color: #fff !important; }
.score-hero { background: var(--th-hero-grad) !important; border-color: var(--th-border) !important; }
.auth-hero { background: var(--th-auth-grad) !important; border-color: var(--th-border) !important; }
.stat { background: var(--th-stat-bg, rgba(148,163,184,0.08)) !important; border-color: var(--th-stat-border, rgba(148,163,184,0.12)) !important; border-radius: var(--shape-input) !important; }
.stat .l { color: var(--th-muted) !important; }
table th { color: var(--th-h2) !important; }
th, td { border-color: var(--th-border) !important; }
.ball { background: var(--th-chip-bg) !important; border-color: var(--th-chip-border) !important; color: var(--th-text) !important; }
.key {
  background: linear-gradient(180deg, var(--th-key-grad-top, #1e293b), var(--th-key-grad-bot, #1a2540)) !important;
  border-color: var(--th-chip-border) !important; color: var(--th-text) !important;
  border-radius: var(--shape-key) !important;
}
.key small { color: var(--th-muted) !important; }
.pending-box { background: var(--th-banner-bg) !important; border-radius: var(--shape-input) !important; }
nav.tabs { background: var(--th-nav-bg) !important; border-color: var(--th-border) !important; }
nav.tabs button { color: var(--th-muted) !important; }
nav.tabs button.active { color: var(--th-primary) !important; }
.modal { background: var(--th-modal-bg) !important; border-color: var(--th-input-border) !important; border-radius: var(--shape-modal) var(--shape-modal) 0 0 !important; }
.modal-wrap.center .modal { border-radius: var(--shape-modal) !important; }
.modal h2 { color: var(--th-text) !important; }
.modal .hint { color: var(--th-muted) !important; }
.banner { background: var(--th-banner-bg) !important; color: var(--th-text) !important; border-radius: var(--shape-input) !important; }
.banner.amber { border-left-color: #f59e0b !important; }
.banner.blue { border-left-color: var(--th-secondary) !important; }
.badge { border-radius: var(--shape-badge) !important; }
.player-card { background: var(--th-banner-bg) !important; border-color: var(--th-input-border) !important; border-radius: var(--shape-card) !important; }
.player-card .st { color: var(--th-muted) !important; }
.player-card.selected { border-color: var(--th-primary) !important; }

<script src="https://accounts.google.com/gsi/client" async defer></script>
<script>
"use strict";

/* ============================================================
   CONFIG — optional real Google Sign-In
   Paste your Google OAuth Client ID below to enable the real
   "Sign in with Google" button (Google Cloud Console → OAuth client).
============================================================ */
const CONFIG = {
  GOOGLE_CLIENT_ID: ""
};

/* ============================================================
   STATE
============================================================ */
const KEY = "cricketScorerState_v2";
let undoStack = [];
let navStack = [];    // screen back-navigation history
let modalStack = [];  // modal back-navigation history (previous modal HTML)
let pendingExtra = null;

function newMatchId() {
  return "M" + nextHistId();
}
function nextHistId() {
  let id = Date.now();
  const hist = state && state.matchHistory ? state.matchHistory : [];
  while (hist.some(function (m) { return m.id === id; })) id++;
  // never re-issue a number used earlier this session (even for abandoned
  // matches) — every match gets its own unique ID
  if (window.__lastIssuedNum && id <= window.__lastIssuedNum) id = window.__lastIssuedNum + 1;
  window.__lastIssuedNum = id;
  return id;
}
function defaultMatch() {
  return {
    matchId: "",
    team1: "Team A",
    team2: "Team B",
    oversLimit: 20,
    players1: [], // empty — only user-selected/created players are added
    players2: [],
    firstBat: "team1"
  };
}

function defaultSettings() {
  return {
    sound: true, vibrate: true,
    volume: 80,
    vibe: "medium",
    ev: { four: true, six: true, wicket: true, win: true, click: true, noball: true, wide: true, milestone: true, other: false },
    theme: { mode: "dark", preset: "ocean", gradient: "none", colors: { primary: "", secondary: "", accent: "", background: "", card: "", text: "", button: "" } },
    shape: { preset: "rounded", radius: 12, iconStyle: "default" },
    autoBackup: true,
    shotPrompt: true,
    promptDots: false,
    batHand: "rh",
    textScale: 1,
    uiScale: 1,
    sugScale: 1,
    googleClientId: ""
  };
}

function defaultState() {
  return {
    screen: "auth",
    user: { signedIn: false, name: "", email: "", photo: "", provider: "" },
    match: defaultMatch(),
    inningsIndex: 0,
    innings: [null, null],
    result: null,
    resultShown: false,
    matchHistory: [],
    settings: defaultSettings(),
    playerDB: {},
    teamDB: {},
    historySavedId: null,
    lastPotm: null,
    pausedMatches: [],
    sync: { code: "", lastBackupAt: "" }
  };
}

let state = defaultState();

function save() {
  try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  try { fsUpdateActiveMatch(); } catch (e) {} // same live-match file, in place
}
function loadSaved() {
  try {
    const s = localStorage.getItem(KEY);
    if (s) {
      const parsed = JSON.parse(s);
      if (parsed && parsed.match && parsed.innings) {
        state = parsed;
        const d = defaultState();
        if (!state.settings) state.settings = d.settings;
        if (!state.settings.ev) state.settings.ev = d.settings.ev;
        if (state.settings.volume === undefined) state.settings.volume = 80;
        if (!state.settings.vibe) state.settings.vibe = "medium";
        if (state.settings.shotPrompt === undefined) state.settings.shotPrompt = true;
        if (state.settings.promptDots === undefined) state.settings.promptDots = false;
        if (!state.settings.batHand) state.settings.batHand = "rh";
        if (state.settings.textScale === undefined) state.settings.textScale = 1;
        if (state.settings.uiScale === undefined) state.settings.uiScale = 1;
        if (state.settings.sugScale === undefined) state.settings.sugScale = 1;
        if (state.settings.googleClientId === undefined) state.settings.googleClientId = "";
        if (state.settings.ev) {
          Object.keys(d.settings.ev).forEach(function (k) {
            if (state.settings.ev[k] === undefined) state.settings.ev[k] = d.settings.ev[k];
          });
        }
        if (!state.settings.theme || typeof state.settings.theme !== "object") state.settings.theme = d.settings.theme;
        else {
          if (!state.settings.theme.colors || typeof state.settings.theme.colors !== "object") state.settings.theme.colors = d.settings.theme.colors;
          if (!state.settings.theme.mode) state.settings.theme.mode = "dark";
          if (!state.settings.theme.preset) state.settings.theme.preset = "ocean";
          if (!state.settings.theme.gradient) state.settings.theme.gradient = "none";
        }
        if (!state.settings.shape || typeof state.settings.shape !== "object") state.settings.shape = d.settings.shape;
        else {
          if (!state.settings.shape.preset) state.settings.shape.preset = "rounded";
          if (state.settings.shape.radius === undefined) state.settings.shape.radius = 12;
          if (!state.settings.shape.iconStyle) state.settings.shape.iconStyle = "default";
        }
        if (!state.sync.driveAccount) state.sync.driveAccount = "";
        if (!state.user) state.user = d.user;
        if (!state.playerDB) state.playerDB = {};
        if (!state.teamDB) state.teamDB = {};
        if (!state.sync) state.sync = d.sync;
        if (!state.matchHistory) state.matchHistory = [];
        if (state.historySavedId === undefined) state.historySavedId = null;
        if (state.lastPotm === undefined) state.lastPotm = null;
        if (!state.pausedMatches) state.pausedMatches = [];
        Object.keys(state.playerDB || {}).forEach(function (k) {
          if (!state.playerDB[k].pid) state.playerDB[k].pid = newPlayerId();
        });
        Object.keys(state.teamDB || {}).forEach(function (k) {
          if (!state.teamDB[k].tid) state.teamDB[k].tid = newTeamId();
        });
      }
    }
  } catch (e) {}
}
function pushUndo() {
  undoStack.push(JSON.stringify(state));
  if (undoStack.length > 100) undoStack.shift();
}
function undo() {
  if (!undoStack.length) { toast("Nothing to undo"); return; }
  state = JSON.parse(undoStack.pop());
  pendingExtra = null;
  save();
  render();
}
function toast(msg) {
  const t = document.createElement("div");
  t.textContent = msg;
  t.style.cssText = "position:fixed;left:50%;top:70px;transform:translateX(-50%);background:#22c55e;color:#fff;padding:9px 16px;border-radius:999px;font-size:12.5px;font-weight:700;z-index:200;box-shadow:0 8px 24px rgba(0,0,0,.4);max-width:90%;text-align:center";
  document.body.appendChild(t);
  setTimeout(function () { t.remove(); }, 1800);
}

/* ============================================================
   SOUND & VIBRATION (editable)
============================================================ */
let audioCtx = null;
function ensureAudio() {
  try {
    if (!audioCtx) {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = new AC();
    }
    if (audioCtx.state === "suspended") audioCtx.resume();
  } catch (e) {}
}
function tone(freq, dur, when, type, vol) {
  if (!audioCtx) return;
  try {
    const t0 = audioCtx.currentTime + (when || 0);
    const o = audioCtx.createOscillator();
    const g = audioCtx.createGain();
    o.type = type || "triangle";
    o.frequency.value = freq;
    const master = (state.settings.volume != null ? state.settings.volume : 80) / 100;
    g.gain.setValueAtTime(Math.max(0.001, (vol || 0.22) * master), t0);
    g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
    o.connect(g);
    g.connect(audioCtx.destination);
    o.start(t0);
    o.stop(t0 + dur + 0.02);
  } catch (e) {}
}
const AUDIO_KEY = "asCricketAudio_v1";
const SOUND_EVENTS = [
  { key: "six", label: "SIX", emoji: "🚀", builtin: "Built-in: rising fanfare" },
  { key: "four", label: "FOUR", emoji: "🎉", builtin: "Built-in: bright chime" },
  { key: "wicket", label: "WICKET", emoji: "❌", builtin: "Built-in: falling tone" },
  { key: "noball", label: "NO-BALL", emoji: "🚨", builtin: "Built-in: double beep" },
  { key: "wide", label: "WIDE", emoji: "↔️", builtin: "Built-in: soft buzz" },
  { key: "milestone", label: "50 / 100 RUNS", emoji: "🏅", builtin: "Built-in: milestone fanfare" },
  { key: "other", label: "OTHER RUNS (1-3)", emoji: "🔵", builtin: "Built-in: soft tick" }
];
const SOUND_EVENT_BY_KEY = {};
SOUND_EVENTS.forEach(function (e) { SOUND_EVENT_BY_KEY[e.key] = e; });

let audioStoreCache = null;
function loadAudioStore() {
  if (audioStoreCache) return audioStoreCache;
  try { audioStoreCache = JSON.parse(localStorage.getItem(AUDIO_KEY) || "{}") || {}; }
  catch (e) { audioStoreCache = {}; }
  return audioStoreCache;
}
function saveAudioStore() {
  try {
    localStorage.setItem(AUDIO_KEY, JSON.stringify(audioStoreCache || {}));
    return true;
  } catch (e) {
    showBackupError("This sound file is too large to store on this device (storage full or file too big). Try a shorter clip (under ~1 MB). Your previous sounds are unchanged.");
    return false;
  }
}
function soundLabel(kind) {
  return SOUND_EVENT_BY_KEY[kind] ? SOUND_EVENT_BY_KEY[kind].label : String(kind || "").toUpperCase();
}

let __activeSoundAudio = null;
function stopActiveSound() {
  try { if (__activeSoundAudio && __activeSoundAudio.pause) __activeSoundAudio.pause(); } catch (e) {}
  __activeSoundAudio = null;
}
function notifySoundFallback(kind, why) {
  try {
    toast("⚠️ Custom " + soundLabel(kind) + " sound " + why + " — using the built-in sound");
    const store = loadAudioStore();
    const saved = store[kind];
    if (saved) {
      delete store[kind];
      playSound(kind);
      store[kind] = saved;
    }
  } catch (e) {}
}
function playCustomSound(kind) {
  const rec = (loadAudioStore() || {})[kind];
  if (!rec || !rec.dataUrl) return false;
  if (typeof Audio === "undefined") return false;
  try {
    stopActiveSound();
    const a = new Audio(rec.dataUrl);
    const vol = (state.settings.volume != null ? state.settings.volume : 80) / 100;
    a.volume = Math.max(0, Math.min(1, vol));
    a.onerror = function () { notifySoundFallback(kind, "failed"); };
    const p = a.play();
    if (p && p.catch) p.catch(function () { notifySoundFallback(kind, "failed"); });
    __activeSoundAudio = a;
    return true;
  } catch (e) {
    notifySoundFallback(kind, "failed");
    return false;
  }
}

function playSound(kind) {
  if (!state.settings || !state.settings.sound) return;
  const ev = state.settings.ev || {};
  if (ev[kind] === false) return;
  if (playCustomSound(kind)) return;
  ensureAudio();
  if (!audioCtx) return;
  try {
    if (kind === "four") {
      tone(523.25, 0.12, 0, "triangle", 0.22);
      tone(659.25, 0.12, 0.10, "triangle", 0.22);
      tone(783.99, 0.20, 0.20, "triangle", 0.25);
    } else if (kind === "six") {
      tone(392.00, 0.10, 0, "square", 0.16);
      tone(523.25, 0.10, 0.09, "square", 0.18);
      tone(659.25, 0.10, 0.18, "square", 0.20);
      tone(880.00, 0.28, 0.27, "square", 0.22);
    } else if (kind === "wicket") {
      tone(311.13, 0.18, 0, "sawtooth", 0.18);
      tone(233.08, 0.28, 0.16, "sawtooth", 0.18);
      tone(174.61, 0.38, 0.34, "sawtooth", 0.16);
    } else if (kind === "win") {
      tone(523.25, 0.12, 0, "triangle", 0.22);
      tone(659.25, 0.12, 0.12, "triangle", 0.22);
      tone(783.99, 0.12, 0.24, "triangle", 0.22);
      tone(1046.50, 0.35, 0.36, "triangle", 0.25);
    } else if (kind === "click") {
      tone(660, 0.05, 0, "sine", 0.12);
    } else if (kind === "noball") {
      tone(440, 0.09, 0, "square", 0.16);
      tone(587.33, 0.14, 0.12, "square", 0.18);
    } else if (kind === "wide") {
      tone(330, 0.12, 0, "triangle", 0.16);
      tone(262, 0.16, 0.10, "triangle", 0.15);
    } else if (kind === "milestone") {
      tone(523.25, 0.10, 0, "triangle", 0.20);
      tone(659.25, 0.10, 0.10, "triangle", 0.20);
      tone(783.99, 0.10, 0.20, "triangle", 0.20);
      tone(1046.50, 0.32, 0.30, "triangle", 0.24);
    } else if (kind === "other") {
      tone(600, 0.05, 0, "sine", 0.10);
    }
  } catch (e) {}
}

// ---- Custom sound files: real file picker -> validate -> confirm -> persist ----
let soundPickEvent = null;
let soundPickMeta = null;

function validateAudioDataUrl(dataUrl, cb) {
  if (typeof Audio === "undefined") { cb(true, null); return; }
  let done = false;
  try {
    const a = new Audio();
    a.onloadeddata = function () { if (!done) { done = true; cb(true, null); } };
    a.onerror = function () {
      if (!done) { done = true; cb(false, "This audio file could not be decoded on this device (unsupported or corrupted file). Nothing was changed."); }
    };
    a.src = dataUrl;
    setTimeout(function () { if (!done) { done = true; cb(true, null); } }, 2000);
  } catch (e) {
    if (!done) { done = true; cb(false, "This audio file could not be opened: " + (e && e.message ? e.message : e)); }
  }
}

function chooseSound(evKey) {
  soundPickEvent = evKey;
  soundPickMeta = null;
  const inp = document.getElementById("soundFilePicker");
  if (!inp) return;
  try { inp.value = ""; } catch (e) {}
  if (inp.click) inp.click();
}

function onSoundFilePicked(inp) {
  const file = inp && inp.files && inp.files[0];
  if (!file) return;
  const evKey = soundPickEvent || "six";
  const okType = (file.type && /^audio\//i.test(file.type)) || /\.(mp3|wav|m4a|ogg|aac|flac|webm)$/i.test(file.name || "");
  if (!okType) {
    showBackupError("This file is not a supported audio format (use MP3, WAV, M4A, OGG or AAC). Nothing was changed.");
    return;
  }
  const maxBytes = 1200000;
  if (file.size && file.size > maxBytes) {
    showBackupError("This audio file is too large (" + Math.round(file.size / 1024) + " KB). Choose a clip under 1.2 MB. Nothing was changed.");
    return;
  }
  const rd = new FileReader();
  rd.onload = function (e2) {
    const dataUrl = (e2 && e2.target && e2.target.result) || "";
    if (!dataUrl || dataUrl.indexOf("data:") !== 0) {
      showBackupError("This file could not be read as audio. Nothing was changed.");
      return;
    }
    validateAudioDataUrl(dataUrl, function (ok, msg) {
      if (!ok) {
        showBackupError(msg || "This audio file could not be used. Nothing was changed.");
        return;
      }
      soundPickMeta = { dataUrl: dataUrl, name: file.name || "custom sound" };
      showModal(
        "<h2>Use this sound for " + esc(soundLabel(evKey)) + "?</h2>" +
        '<div class="banner">File: <b>' + esc(soundPickMeta.name) + "</b></div>" +
        '<div class="muted">The audio is copied into the app’s own storage, so it keeps working even if the original file is moved or deleted (web apps cannot keep Android URI permissions).</div>' +
        '<button class="btn green block" style="padding:15px;margin-top:10px" onclick="confirmSaveSound()">✅ Confirm &amp; Save</button>' +
        '<button class="btn ghost block" style="margin-top:10px;padding:13px" onclick="cancelSoundPick()">✖️ Cancel</button>',
        true
      );
    });
  };
  rd.onerror = function () {
    showBackupError("This file could not be read (permission denied or the file is no longer available). Nothing was changed.");
  };
  try { rd.readAsDataURL(file); } catch (e) {
    showBackupError("Could not open this file: " + (e && e.message ? e.message : e));
  }
}

function confirmSaveSound() {
  const evKey = soundPickEvent || "six";
  const meta = soundPickMeta;
  closeModal();
  if (!meta) return;
  const store = loadAudioStore();
  const backup = JSON.parse(JSON.stringify(store));
  store[evKey] = { name: meta.name, dataUrl: meta.dataUrl, addedAt: Date.now() };
  audioStoreCache = store;
  if (!saveAudioStore()) {
    audioStoreCache = backup; // never claim success on failure
    return;
  }
  soundPickMeta = null;
  render();
  toast(soundLabel(evKey) + " sound saved: " + meta.name);
}

function cancelSoundPick() {
  soundPickMeta = null;
  closeModal();
  toast("Cancelled — previous sound kept");
}

function resetSoundEvent(evKey) {
  const store = loadAudioStore();
  if (store[evKey]) {
    delete store[evKey];
    audioStoreCache = store;
    saveAudioStore();
  }
  render();
  toast(soundLabel(evKey) + " sound reset to built-in");
}

function previewSoundEvent(evKey) {
  const wasS = state.settings.sound;
  const wasEv = state.settings.ev[evKey];
  state.settings.sound = true;
  state.settings.ev[evKey] = true;
  playSound(evKey);
  state.settings.sound = wasS;
  state.settings.ev[evKey] = wasEv;
}

function restoreAllSounds() {
  showModal(
    "<h2>Restore all default sounds?</h2>" +
    '<div class="banner">Removes every custom sound file and restores built-in sounds, event toggles and volume. Match data, players and statistics are never touched.</div>' +
    '<button class="btn amber block" style="padding:14px" onclick="confirmRestoreAllSounds()">✅ Confirm Restore</button>' +
    '<button class="btn ghost block" style="margin-top:10px;padding:13px" onclick="closeModal()">✖️ Cancel</button>',
    false
  );
}
function confirmRestoreAllSounds() {
  audioStoreCache = {};
  try { localStorage.removeItem(AUDIO_KEY); } catch (e) {}

/* ============================================================
   HELPERS
============================================================ */
function esc(s) {
  return String(s == null ? "" : s)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}
function cur() { return state.innings[state.inningsIndex]; }
function oversStr(balls) { return Math.floor(balls / 6) + "." + (balls % 6); }
function crr(inn) {
  if (!inn || inn.legalBalls === 0) return "0.00";
  return (inn.runs / (inn.legalBalls / 6)).toFixed(2);
}
function rrr(inn) {
  if (!inn || !inn.target) return null;
  const ballsLeft = state.match.oversLimit * 6 - inn.legalBalls;
  if (ballsLeft <= 0) return null;
  const need = inn.target - inn.runs;
  if (need <= 0) return "0.00";
  return (need / (ballsLeft / 6)).toFixed(2);
}
function strikeRate(b) { if (!b.balls) return "0.00"; return ((b.runs / b.balls) * 100).toFixed(2); }
function econ(b) { if (!b.balls) return "0.00"; return (b.runs / (b.balls / 6)).toFixed(2); }
function nameKey(n) { return String(n || "").trim().toLowerCase(); }
function avatarEmoji(name) {
  const list = ["🏏", "🧢", "⭐", "🐯", "🦁", "🦅", "🔥", "💪", "🚀", "⚡", "🎯", "👊", "😎", "🦸", "🌟", "🏆"];
  const n = nameKey(name);
  let h = 0;
  for (let i = 0; i < n.length; i++) h = (h * 31 + n.charCodeAt(i)) >>> 0;
  return list[h % list.length];
}
function avatarHtml(name, photo, cls) {
  const c = cls || "";
  if (photo) return '<div class="avatar ' + c + '"><img src="' + esc(photo) + '" alt=""></div>';
  return '<div class="avatar ' + c + '">' + avatarEmoji(name) + "</div>";
}
function teamLogoHtml(teamName, cls) {
  const t = state.teamDB[nameKey(teamName)];
  if (t && t.logo) return '<div class="avatar ' + (cls || "md") + '"><img src="' + esc(t.logo) + '" alt=""></div>';
  return '<div class="avatar ' + (cls || "md") + '">🏏</div>';
}

function decodeJwt(token) {
  try {
    const part = token.split(".")[1];
    const b64 = part.replace(/-/g, "+").replace(/_/g, "/");
    const json = decodeURIComponent(atob(b64).split("").map(function (c) {
      return "%" + ("00" + c.charCodeAt(0).toString(16)).slice(-2);
    }).join(""));
    return JSON.parse(json);
  } catch (e) { return null; }
}

function googleSignInClick() {
  const cid = (CONFIG.GOOGLE_CLIENT_ID || state.settings.googleClientId || "").trim();
  if (cid && window.google && google.accounts && google.accounts.oauth2) {
    try {
      const client = google.accounts.oauth2.initTokenClient({
        client_id: cid,
        scope: "openid email profile",
        callback: function (resp) {
          if (!resp || !resp.access_token) { openSignInSheet(); return; }
          fetch("https://www.googleapis.com/oauth2/v3/userinfo", {
            headers: { Authorization: "Bearer " + resp.access_token }
          }).then(function (r) { return r.json(); }).then(function (u) {
            completeSignIn({
              name: u.name || u.email || "Player",
              email: u.email || "",
              photo: u.picture || "",
              provider: "google"
            });
          }).catch(function () { openSignInSheet(); });
        },
        error_callback: function () { openSignInSheet(); }
      });
      client.requestAccessToken();
      return;
    } catch (e) { /* fall through */ }
  }
  openSignInSheet();
}

/* ============================================================
   BACKUP & RESTORE (Sync Code + file + optional cloud)
============================================================ */
function backupPayload(full) {
  return {
    v: 2,
    user: { name: state.user.name, email: state.user.email },
    matchHistory: state.matchHistory,
    playerDB: full ? state.playerDB : Object.keys(state.playerDB).reduce(function (o, k) {
      const p = state.playerDB[k];
      o[k] = { name: p.name, photo: "" }; // photos stripped for compact code
      return o;
    }, {}),
    teamDB: full ? state.teamDB : Object.keys(state.teamDB).reduce(function (o, k) {
      const t = state.teamDB[k];
      o[k] = { name: t.name, logo: "" };
      return o;
    }, {}),
    settings: state.settings,
    currentMatch: (state.innings[0] && !state.result) ? {
      match: state.match,
      innings: state.innings,
      inningsIndex: state.inningsIndex
    } : null,
    savedAt: new Date().toISOString()
  };
}
function mergeBackup(data) {
  if (!data) return;
  if (data.matchHistory && data.matchHistory.length) {
    const have = {};
    (state.matchHistory || []).forEach(function (m) {
      have[m.id] = true;
      if (m.matchId != null) have["mid:" + m.matchId] = true;
    });
    data.matchHistory.forEach(function (m) {
      const midKey = m.matchId != null ? "mid:" + m.matchId : null;
      if (have[m.id] || (midKey && have[midKey])) return;
      have[m.id] = true;
      if (midKey) have[midKey] = true;
      state.matchHistory.push(m);
    });
    state.matchHistory.sort(function (a, b) { return (b.id || 0) - (a.id || 0); });
  }
  if (data.playerDB) {
    Object.keys(data.playerDB).forEach(function (k) {
      const p = data.playerDB[k];
      if (!state.playerDB[k]) state.playerDB[k] = { name: p.name, photo: p.photo || "" };
      else if (!state.playerDB[k].photo && p.photo) state.playerDB[k].photo = p.photo;
    });
  }
  if (data.teamDB) {
    Object.keys(data.teamDB).forEach(function (k) {
      const t = data.teamDB[k];
      if (!state.teamDB[k]) state.teamDB[k] = { name: t.name, logo: t.logo || "" };
      else if (!state.teamDB[k].logo && t.logo) state.teamDB[k].logo = t.logo;
    });
  }
  if (data.settings) {
    const keep = state.settings;
    state.settings = Object.assign(keep, data.settings);
    if (!state.settings.ev) state.settings.ev = defaultSettings().ev;
  }
  save();
}

function b64FromBytes(bytes) {
  let s = "";
  const chunk = 0x8000;
  for (let i = 0; i < bytes.length; i += chunk) {
    s += String.fromCharCode.apply(null, bytes.subarray(i, i + chunk));
  }
  return btoa(s);
}
function bytesFromB64(b64) {
  const bin = atob(b64);
  const out = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
  return out;
}
async function makeSyncCode(full) {
  const payload = backupPayload(full);
  const json = JSON.stringify(payload);
  const bytes = new TextEncoder().encode(json);
  try {
    if (typeof CompressionStream !== "undefined") {
      const cs = new CompressionStream("deflate-raw");
      const stream = new Blob([bytes]).stream().pipeThrough(cs);
      const buf = await new Response(stream).arrayBuffer();
      return "CS1." + b64FromBytes(new Uint8Array(buf));
    }
  } catch (e) {}
  return "CS0." + b64FromBytes(bytes);
}
async function readSyncCode(code) {
  const s = String(code || "").trim();
  if (!s) return null;
  try {
    if (s.indexOf("CS1.") === 0) {
      const bytes = bytesFromB64(s.slice(4));
      const ds = new DecompressionStream("deflate-raw");
      const stream = new Blob([bytes]).stream().pipeThrough(ds);
      const buf = await new Response(stream).arrayBuffer();
      return JSON.parse(new TextDecoder().decode(buf));
    }
    if (s.indexOf("CS0.") === 0) {
      return JSON.parse(new TextDecoder().decode(bytesFromB64(s.slice(4))));
    }
    // plain JSON pasted directly
    return JSON.parse(s);
  } catch (e) { return null; }
}

/* optional cloud store (jsonblob) — best effort */
function cloudSave(code, payload) {
  return fetch("https://jsonblob.com/api/jsonBlob", {
    method: "POST",
    headers: { "Content-Type": "application/json", "Accept": "application/json" },
    body: JSON.stringify(payload)
  }).then(function (r) {
    const id = r.headers.get("X-JsonBlob-Id");
    if (!r.ok || !id) throw new Error("cloud save failed");
    return id;
  });
}
function cloudLoad(id) {
  return fetch("https://jsonblob.com/api/jsonBlob/" + encodeURIComponent(id), {
    headers: { "Accept": "application/json" }
  }).then(function (r) {
    if (!r.ok) throw new Error("cloud load failed");
    return r.json();
  });
}

async function backupNow() {
  try {
    toast("Preparing backup…");
    const code = await makeSyncCode(true);
    state.sync.code = code.slice(0, 240) === code ? code : code; // full code kept
    state.sync.lastBackupAt = new Date().toLocaleString("en-IN");
    save();
    let cloudNote = "Code ready — copy it and paste on any device to restore.";
    try {
      const id = await cloudSave(code, backupPayload(true));
      state.sync.code = id;
      state.sync.lastBackupAt = new Date().toLocaleString("en-IN");
      save();
      cloudNote = "☁️ Cloud backup done! Your Sync Code: <b>" + esc(id) + "</b>";
    } catch (e) {}
    showModal(
      "<h2>☁️ Backup Complete</h2>" +
      '<div class="banner">' + cloudNote + "</div>" +
      '<div class="banner amber">Your Sync Code is saved on this device. On another device: Profile → Restore → paste this code (or sign in and Restore from File).</div>' +
      '<div class="row2">' +
      '<button class="btn blue" onclick="copySyncCode()">📋 Copy Sync Code</button>' +
      '<button class="btn green" onclick="downloadBackupFile()">💾 Download File</button>' +
      "</div>" +
      '<button class="btn ghost block" style="margin-top:10px" onclick="closeModal()">Done</button>',
      true
    );
  } catch (e) {
    alert("Backup failed: " + e.message);
  }
}
function copySyncCode() {
  const code = state.sync.code || "";
  if (!code) { toast("No backup yet — tap Backup Now first"); return; }
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(code).then(function () { toast("Sync Code copied!"); }, function () { fallbackCopy(code); });
  } else fallbackCopy(code);
}
function openRestoreSheet() {
  showModal(
    "<h2>☁️ Restore Backup</h2>" +
    '<div class="hint">Paste your Sync Code below (from another device\'s Profile → Backup), or restore from a backup file.</div>' +
    '<label>Sync Code</label><textarea id="rsCode" placeholder="Paste sync code here…" style="min-height:100px">' + esc(state.sync.code) + "</textarea>" +
    '<button class="btn green block" style="margin-top:12px" onclick="restoreFromCode()">☁️ Restore from Code</button>' +
    '<div class="divider"></div>' +
    '<button class="btn blue block" onclick="document.getElementById(\'rsFile\').click()">📁 Restore from File</button>' +
    '<input type="file" id="rsFile" accept="application/json,.json" style="display:none" onchange="restoreFromFileInput(this)">' +
    '<button class="btn ghost block" style="margin-top:8px" onclick="closeModal()">Cancel</button>',
    true
  );
}
async function restoreFromCode() {
  const code = (document.getElementById("rsCode").value || "").trim();
  if (!code) { alert("Paste a sync code first."); return; }
  let data = null;
  try {
    if (/^[A-Za-z0-9\-_]{10,}$/.test(code) && code.indexOf("CS") !== 0) {
      // cloud id — try jsonblob
      data = await cloudLoad(code);
    }
  } catch (e) {}
  if (!data) data = await readSyncCode(code);
  if (!data) { alert("Invalid sync code."); return; }
  mergeBackup(data);
  state.sync.code = code;
  save();
  closeModal();
  render();
  toast("✅ Backup restored!");
}
function restoreFromFileInput(input) {
  const f = input.files && input.files[0];
  if (!f) return;
  const rd = new FileReader();
  rd.onload = function () {
    try {
      const data = JSON.parse(rd.result);
      mergeBackup(data);
      closeModal();
      render();
      toast("✅ Backup restored from file!");
    } catch (e) {
      alert("Invalid backup file.");
    }
  };
  rd.readAsText(f);
}
function downloadBackupFile() {
  const data = backupPayload(true);
  const blob = new Blob([JSON.stringify(data, null, 1)], { type: "application/json" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cricket-scorer-backup.json";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("Backup file downloaded!");
}

    state.playerDB[k] = { name: String(name).trim(), photo: photo || "", pid: newPlayerId() };

function newTeamId() {
  window.__tidSeq = (window.__tidSeq || 0) + 1;

function resizePhoto(file, cb) {
  const rd = new FileReader();
  rd.onload = function () {
    const img = new Image();
    img.onload = function () {
      try {
        const size = 256;
        const canvas = document.createElement("canvas");
        canvas.width = size; canvas.height = size;
        const ctx = canvas.getContext("2d");
        const s = Math.min(img.width, img.height);
        ctx.drawImage(img, (img.width - s) / 2, (img.height - s) / 2, s, s, 0, 0, size, size);
        cb(canvas.toDataURL("image/jpeg", 0.72));
      } catch (e) { cb(rd.result); }
    };
    img.onerror = function () { cb(""); };
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}

/* ============================================================
   INNINGS SETUP & SCORING ENGINE (unchanged logic)
============================================================ */
function newInningsObj(batKey, target) {
  const m = state.match;
  const bowlKey = batKey === "team1" ? "team2" : "team1";
  const batPlayers = (batKey === "team1" ? m.players1 : m.players2).slice();
  return {
    batKey: batKey,
    bowlKey: bowlKey,
    battingTeam: batKey === "team1" ? m.team1 : m.team2,
    bowlingTeam: bowlKey === "team1" ? m.team1 : m.team2,
    maxWickets: Math.min(10, Math.max(1, batPlayers.length - 1)),
    runs: 0, wickets: 0, legalBalls: 0,
    extras: { wd: 0, nb: 0, b: 0, lb: 0 },
    batters: batPlayers.map(function (n) {
      return { name: n, runs: 0, balls: 0, fours: 0, sixes: 0, dots: 0, status: "didnotbat", how: "" };
    }),
    bowlers: [],
    striker: -1, nonStriker: -1, bowler: -1,
    timeline: [],
    currentOver: [],
    currentOverRunsCharged: 0,
    fow: [],
    shots: [],
    wicketsList: [],
    partnership: { runs: 0, balls: 0 },
    target: target || null,
    completed: false,
    playersSet: false
  };
}

function ensureBatter(inn, name) {
  const k = nameKey(name);
  for (let i = 0; i < inn.batters.length; i++) {
    if (nameKey(inn.batters[i].name) === k) return i;
  }
  inn.batters.push({ name: String(name).trim(), runs: 0, balls: 0, fours: 0, sixes: 0, dots: 0, status: "didnotbat", how: "" });
  // batting team's match roster grows with the user-chosen player (never placeholders)
  const roster = inn.batKey === "team1" ? state.match.players1 : state.match.players2;
  if (!roster.some(function (n) { return nameKey(n) === k; })) roster.push(String(name).trim());
  inn.maxWickets = Math.min(10, Math.max(1, inn.batters.length - 1));
  return inn.batters.length - 1;
}

function getBowlerIdx(inn, name) {
  for (let i = 0; i < inn.bowlers.length; i++) {
    if (inn.bowlers[i].name === name) return i;
  }
  inn.bowlers.push({ name: name, balls: 0, runs: 0, wickets: 0, maidens: 0, dots: 0, wd: 0, nb: 0 });
  return inn.bowlers.length - 1;
}

function swapStrike(inn) {
  const t = inn.striker; inn.striker = inn.nonStriker; inn.nonStriker = t;
}

function applyDelivery(d) {
  const inn = cur();
  if (!inn || inn.completed) return;

  pushUndo();
  pendingExtra = null;

  const ballBefore = inn.legalBalls;
  const overNo = Math.floor(ballBefore / 6);
  const ballNo = (ballBefore % 6) + 1;
  const label = overNo + "." + ballNo;
  const legal = !(d.kind === "wide" || d.kind === "noball");

  const batContact = (d.kind === "runs") || (d.kind === "noball" && (d.batRuns || 0) > 0);
  const shotBatter = (inn.striker >= 0 && inn.batters[inn.striker]) ? inn.batters[inn.striker].name : "";
  const batRunsForShot = d.kind === "noball" ? (d.batRuns || 0) : (d.runs || 0);

  let chip = "";
  let chipClass = "";
  let runsThisBall = 0;

  if (d.kind === "wide") {
    const extra = d.runs || 0;
    const total = 1 + extra;
    inn.runs += total;
    inn.extras.wd += total;
    inn.bowlers[inn.bowler].runs += total;
    inn.bowlers[inn.bowler].wd = (inn.bowlers[inn.bowler].wd || 0) + 1;
    inn.currentOverRunsCharged += total;
    runsThisBall = total;
    if (extra % 2 === 1) swapStrike(inn);
    chip = extra > 0 ? "Wd+" + extra : "Wd";
    chipClass = "ex";
  } else if (d.kind === "noball") {
    const bat = d.batRuns || 0;
    inn.runs += 1 + bat;
    inn.extras.nb += 1;
    const strikerB = inn.batters[inn.striker];
    strikerB.runs += bat;
    if (bat === 4) strikerB.fours++;
    if (bat === 6) strikerB.sixes++;
    inn.bowlers[inn.bowler].nb = (inn.bowlers[inn.bowler].nb || 0) + 1;
    inn.bowlers[inn.bowler].runs += 1 + bat;
    inn.currentOverRunsCharged += 1 + bat;
    runsThisBall = 1 + bat;
    if (bat % 2 === 1) swapStrike(inn);
    chip = bat > 0 ? "NB+" + bat : "NB";
    chipClass = "ex";
  } else if (d.kind === "bye" || d.kind === "legbye") {
    const r = d.runs || 0;
    inn.runs += r;
    if (d.kind === "bye") inn.extras.b += r; else inn.extras.lb += r;
    inn.batters[inn.striker].balls++;
    inn.bowlers[inn.bowler].balls++;
    runsThisBall = r;
    if (r % 2 === 1) swapStrike(inn);
    chip = r + (d.kind === "bye" ? "b" : "lb");
    chipClass = "ex";
  } else {
    const r = d.runs || 0;
    inn.runs += r;
    const strikerB = inn.batters[inn.striker];
    strikerB.runs += r;
    strikerB.balls++;
    if (r === 4) strikerB.fours++;
    if (r === 6) strikerB.sixes++;
    if (r === 0) strikerB.dots = (strikerB.dots || 0) + 1;
    if ((strikerB.runs - r < 50 && strikerB.runs >= 50) || (strikerB.runs - r < 100 && strikerB.runs >= 100) || (strikerB.runs - r < 150 && strikerB.runs >= 150)) { playSound("milestone"); }
    inn.bowlers[inn.bowler].runs += r;
    inn.bowlers[inn.bowler].balls++;
    inn.currentOverRunsCharged += r;
    runsThisBall = r;
    if (r % 2 === 1) swapStrike(inn);
    chip = String(r);
    if (r === 0) { chip = "•"; chipClass = "dot"; }
    else if (r === 4) chipClass = "r4";
    else if (r === 6) chipClass = "r6";
  }

  // true dot ball for the bowler (legal delivery, no runs to anyone)
  if (legal && runsThisBall === 0 && inn.bowler >= 0) {
    inn.bowlers[inn.bowler].dots = (inn.bowlers[inn.bowler].dots || 0) + 1;
  }

  if (legal) inn.legalBalls++;
  inn.partnership.runs += runsThisBall;
  if (legal) inn.partnership.balls++;

  let wicketHappened = false;
  if (d.wicket) {
    wicketHappened = true;
    processWicket(inn, d.wicket, label);
    chip = chip === "•" ? "W" : chip + "W";
    chipClass = "w";
  }

  inn.timeline.push({
    over: label,
    chip: chip,
    kind: d.kind,
    runs: runsThisBall,
    wicket: wicketHappened,
    desc: describeBall(d, label)
  });
  inn.currentOver.push({ chip: chip, cls: chipClass });

  let needBowler = false;
  if (legal && inn.legalBalls > 0 && inn.legalBalls % 6 === 0) {
    if (inn.currentOverRunsCharged === 0 && inn.bowler >= 0) {
      inn.bowlers[inn.bowler].maidens++;
    }
    inn.currentOverRunsCharged = 0;
    inn.currentOver = [];
    swapStrike(inn);
    needBowler = true;
  }

  const ended = checkInningsEnd();

  try {
    if (wicketHappened) { playSound("wicket"); buzz([150, 80, 150]); }
    else if (d.kind === "runs" && d.runs === 4) { playSound("four"); buzz(60); }
    else if (d.kind === "runs" && d.runs === 6) { playSound("six"); buzz([30, 50, 30, 50, 120]); }
    else if (d.kind === "noball" && d.batRuns === 4) { playSound("four"); buzz(60); }
    else if (d.kind === "noball" && d.batRuns === 6) { playSound("six"); buzz([30, 50, 30, 50, 120]); }
    else if (d.kind === "runs" && d.runs === 0 && !wicketHappened) { playSound("click"); }
    else if (d.kind === "noball") { playSound("noball"); buzz(40); }
    else if (d.kind === "wide") { playSound("wide"); buzz(40); }
    else if (d.kind === "runs" || d.kind === "bye" || d.kind === "legbye") { playSound("other"); }
  } catch (e) {}

  save();
  render();

  let openBatter = false;
  if (wicketHappened && !ended) {
    openBatter = (inn.striker < 0 || inn.nonStriker < 0 ||
      inn.batters[inn.striker].status !== "notout" || inn.batters[inn.nonStriker].status !== "notout");
  }

  function afterBallChain() {
    if (ended) {
      setTimeout(openInningsEndFlow, 80);
      return;
    }
    if (openBatter) {
      openNewBatterModal(function () {
        if (needBowler) openBowlerModal();
      });
      return;
    }
    if (needBowler) {
      openBowlerModal();
    }
  }

  const wantShot = batContact && !wicketHappened && shotBatter &&
    state.settings.shotPrompt !== false &&
    (batRunsForShot > 0 || state.settings.promptDots === true);

  if (wantShot) {
    openShotModal({ batter: shotBatter, runs: batRunsForShot }, afterBallChain);
  } else {
    afterBallChain();
  }
}

function describeBall(d, label) {
  const bowler = cur().bowler >= 0 ? cur().bowlers[cur().bowler].name : "Bowler";
  const striker = cur().striker >= 0 ? cur().batters[cur().striker].name : "Batter";
  if (d.wicket) {
    const nm = d.wicket.out === "nonstriker" ? (cur().batters[cur().nonStriker] ? cur().batters[cur().nonStriker].name : "Batter") : striker;
    return label + " • " + d.wicket.type + " (" + nm + ")";
  }
  if (d.kind === "wide") return label + " • Wide" + (d.runs ? " +" + d.runs : "");
  if (d.kind === "noball") return label + " • No ball" + (d.batRuns ? " +" + d.batRuns + " runs" : "");
  if (d.kind === "bye") return label + " • " + d.runs + " Bye";
  if (d.kind === "legbye") return label + " • " + d.runs + " Leg bye";
  return label + " • " + d.runs + (d.runs === 1 ? " run" : " runs");
}

function processWicket(inn, w, label) {
  const outIdx = w.out === "nonstriker" ? inn.nonStriker : inn.striker;
  if (outIdx >= 0 && inn.batters[outIdx]) {
    const p = inn.batters[outIdx];
    p.status = "out";
    p.how = dismissalText(w);
    if (!inn.wicketsList) inn.wicketsList = [];
    inn.wicketsList.push({
      type: w.type,
      fielder: w.fielder || "",
      out: w.out || "striker",
      bowler: inn.bowler >= 0 ? inn.bowlers[inn.bowler].name : "",
      batter: p.name,
      over: label
    });
    inn.fow.push({
      runs: inn.runs,
      wickets: inn.wickets + 1,
      over: label,
      batter: p.name,
      partnership: inn.partnership.runs
    });
    inn.wickets++;
    inn.partnership = { runs: 0, balls: 0 };

    const creditTypes = ["Bowled", "Caught", "LBW", "Stumped", "Hit Wicket", "Caught & Bowled"];
    if (creditTypes.indexOf(w.type) >= 0 && inn.bowler >= 0) {
      inn.bowlers[inn.bowler].wickets++;
    }
    if (inn.wickets < inn.maxWickets) {
      const nextIdx = inn.batters.findIndex(function (b) { return b.status === "didnotbat"; });
      if (nextIdx >= 0) {
        if (w.out === "nonstriker") inn.nonStriker = nextIdx; else inn.striker = nextIdx;
      }
    }
  }
}

function dismissalText(w) {
  let t = w.type;
  const bw = cur().bowler >= 0 ? cur().bowlers[cur().bowler].name : "bowler";
  if (w.type === "Caught") t = "c " + (w.fielder || "fielder") + " b " + bw;
  else if (w.type === "Caught & Bowled") t = "c & b " + bw;
  else if (w.type === "Bowled") t = "b " + bw;
  else if (w.type === "LBW") t = "lbw b " + bw;
  else if (w.type === "Stumped") t = "st " + (w.fielder || "wk") + " b " + bw;
  else if (w.type === "Run Out") t = "run out (" + (w.fielder || "fielder") + ")";
  else if (w.type === "Hit Wicket") t = "hit wicket b " + bw;
  else t = w.type.toLowerCase();
  return t;
}

function checkInningsEnd() {
  const inn = cur();
  if (!inn || inn.completed) return inn ? inn.completed : false;
  const allOut = inn.wickets >= inn.maxWickets;
  const oversDone = inn.legalBalls >= state.match.oversLimit * 6;
  const chased = inn.target != null && inn.runs >= inn.target;
  if (allOut || oversDone || chased) {
    inn.completed = true;
    return true;
  }
  return false;
}

function computeResult() {
  const i1 = state.innings[0];
  const i2 = state.innings[1];
  if (!i1 || !i1.completed) return null;
  if (!i2) return null;
  if (!i2.completed) return null;
  if (i2.runs > i1.runs) {
    return {
      headline: i2.battingTeam + " won by " + (i2.maxWickets - i2.wickets) + " wickets",
      sub: "Target " + i2.target + " • Final score " + i2.runs + "/" + i2.wickets
    };
  }
  if (i2.runs < i1.runs) {
    return {
      headline: i1.battingTeam + " won by " + (i1.runs - i2.runs) + " runs",
      sub: i1.battingTeam + " " + i1.runs + "/" + i1.wickets + " • " + i2.battingTeam + " " + i2.runs + "/" + i2.wickets
    };
  }
  return { headline: "Match Tied!", sub: "Both teams " + i1.runs + " runs" };
}


/* ============================================================
   WAGON WHEEL — shot map (ground chart)
============================================================ */
const SECTOR_NAMES_RH = ["Long Off", "Deep Cover", "Deep Point", "Third Man", "Fine Leg", "Deep Square Leg", "Deep Mid-Wicket", "Long On"];
const SECTOR_NAMES_LH = ["Long On", "Deep Mid-Wicket", "Deep Square Leg", "Fine Leg", "Third Man", "Deep Point", "Deep Cover", "Long Off"];

function sectorName(i) {
  const hand = (state.settings && state.settings.batHand === "lh") ? SECTOR_NAMES_LH : SECTOR_NAMES_RH;
  return hand[i % 8];
}
function sectorPath(i, r) {
  const cx = 150, cy = 150;
  const a0 = (i * 45 - 90) * Math.PI / 180;
  const a1 = ((i + 1) * 45 - 90) * Math.PI / 180;
  const x0 = cx + r * Math.cos(a0), y0 = cy + r * Math.sin(a0);
  const x1 = cx + r * Math.cos(a1), y1 = cy + r * Math.sin(a1);
  return "M" + cx + "," + cy + " L" + x0.toFixed(1) + "," + y0.toFixed(1) + " A" + r + "," + r + " 0 0 1 " + x1.toFixed(1) + "," + y1.toFixed(1) + " Z";
}
function sectorLabelPos(i, r) {
  const cx = 150, cy = 150;
  const a = ((i * 45 + 22.5) - 90) * Math.PI / 180;
  return { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
}
function groundSvgInteractive() {
  let paths = "";
  for (let i = 0; i < 8; i++) {
    const lp = sectorLabelPos(i, 96);
    paths += '<path d="' + sectorPath(i, 132) + '" fill="rgba(34,197,94,' + (0.10 + (i % 2) * 0.12) + ')" stroke="#22c55e" stroke-width="1.2" style="cursor:pointer" onclick="recordShotSector(' + i + ')"></path>';
    paths += '<text x="' + lp.x.toFixed(0) + '" y="' + lp.y.toFixed(0) + '" text-anchor="middle" font-size="9.5" font-weight="700" fill="#e8eef7" style="pointer-events:none">' + sectorName(i) + "</text>";
  }
  return '<svg viewBox="0 0 300 300" style="width:100%;max-width:330px;display:block;margin:0 auto;background:#0e2a1d;border-radius:16px;border:1px solid #24506b">' +
    '<circle cx="150" cy="150" r="132" fill="#14532d" stroke="#4ade80" stroke-width="2"></circle>' +
    '<circle cx="150" cy="150" r="88" fill="none" stroke="#4ade80" stroke-width="1" stroke-dasharray="4 4"></circle>' +
    paths +
    '<rect x="141" y="108" width="18" height="84" rx="3" fill="#c8b280" stroke="#a38a54" stroke-width="1"></rect>' +
    '<rect x="134" y="104" width="32" height="4" rx="1" fill="#fff"></rect>' +
    '<rect x="134" y="192" width="32" height="4" rx="1" fill="#fff"></rect>' +
    '<circle cx="150" cy="178" r="5" fill="#fbbf24" stroke="#fff" stroke-width="1.5"></circle>' +
    '<circle cx="150" cy="122" r="4" fill="#93c5fd" stroke="#fff" stroke-width="1.2"></circle>' +
    "</svg>";
}
function groundSvgAnalytics(shotsMap) {
  // shotsMap: { "0": {n, runs}, ... }
  let maxN = 1;
  Object.keys(shotsMap || {}).forEach(function (k) {
    const v = shotsMap[k];
    if (v && v.n > maxN) maxN = v.n;
  });
  let paths = "";
  for (let i = 0; i < 8; i++) {
    const v = shotsMap[i] || { n: 0, runs: 0 };
    const op = v.n ? (0.25 + 0.65 * (v.n / maxN)) : 0.06;
    const lp = sectorLabelPos(i, 96);
    paths += '<path d="' + sectorPath(i, 132) + '" fill="rgba(251,191,36,' + op.toFixed(2) + ')" stroke="#f59e0b" stroke-width="1"></path>';

    }

/* ============================================================
   FIELDING aggregation helpers
============================================================ */
function aggregateFielding(inningsList) {
  const F = {};
  (inningsList || []).forEach(function (inn) {
    if (!inn || !inn.wicketsList) return;
    inn.wicketsList.forEach(function (w) {
      if (w.type === "Caught" && w.fielder) {
        if (!F[w.fielder]) F[w.fielder] = { c: 0, ro: 0, st: 0 };
        F[w.fielder].c++;
      } else if (w.type === "Caught & Bowled" && w.bowler) {
        if (!F[w.bowler]) F[w.bowler] = { c: 0, ro: 0, st: 0 };
        F[w.bowler].c++;
      } else if (w.type === "Stumped" && w.fielder) {
        if (!F[w.fielder]) F[w.fielder] = { c: 0, ro: 0, st: 0 };
        F[w.fielder].st++;
      } else if (w.type === "Run Out" && w.fielder) {
        if (!F[w.fielder]) F[w.fielder] = { c: 0, ro: 0, st: 0 };
        F[w.fielder].ro++;
      }
    });
  });
  return F;
}
