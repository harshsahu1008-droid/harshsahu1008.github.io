  // simply return to the Match Setup screen. Otherwise clear it now.
  if (state.innings[0] || state.result || state.historySavedId) {
    startFreshMatch(true);
  } else {
    state.screen = "setup";
    save();
    render();
  }
}

function findPausedIdx(matchId) {
  return (state.pausedMatches || []).findIndex(function (x) {
    return String(x.matchId) === String(matchId);
  });
}

function snapshotLiveMatch() {
  const inn = state.innings[0];
  if (!inn || state.result) return null;
  if (!state.match.matchId) state.match.matchId = newMatchId();
  return {
    matchId: state.match.matchId,
    paused: true,
    pausedAt: Date.now(),
    date: new Date().toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }),
    match: JSON.parse(JSON.stringify(state.match)),
    innings: JSON.parse(JSON.stringify(state.innings)),
    inningsIndex: state.inningsIndex
  };
}

function upsertPaused(snap) {
  if (!snap) return;
  if (!state.pausedMatches) state.pausedMatches = [];
  const i = findPausedIdx(snap.matchId);
  if (i >= 0) state.pausedMatches[i] = snap;
  else state.pausedMatches.push(snap);
}

function clearLiveMatchState() {
  state.match = defaultMatch();
  state.match.matchId = "";
  state.innings = [null, null];
  state.inningsIndex = 0;
  state.result = null;
  state.resultShown = false;
  state.historySavedId = null;
  state.lastPotm = null;
  undoStack = [];
  pendingExtra = null;
}

function pauseMatch() {
  const snap = snapshotLiveMatch();
  if (!snap) { toast("No active match to pause"); return; }
  upsertPaused(snap); // one persistent record per Match ID (upsert, never duplicate)
  try { fsUpdateActiveMatch(); } catch (e) {} // same match file, marked paused
  clearLiveMatchState();
  state.screen = "tournament"; // History — where Resume lives
  save();
  render();
  toast("Match paused — resume it anytime from History");
}

function resumeMatch(matchId) {
  const i = findPausedIdx(matchId);
  if (i < 0) return;
  // if a different live match is running, preserve it first (never lose data)
  if (state.innings[0] && !state.result && String(state.match.matchId) !== String(matchId)) {
    upsertPaused(snapshotLiveMatch());
  }
  const snap = state.pausedMatches[i];
  state.match = JSON.parse(JSON.stringify(snap.match));
  state.innings = JSON.parse(JSON.stringify(snap.innings));
  state.inningsIndex = snap.inningsIndex || 0;
  state.result = null;
  state.resultShown = false;
  state.historySavedId = null;
  state.lastPotm = null;
  state.pausedMatches.splice(i, 1);
  undoStack = [];
  pendingExtra = null;
  state.screen = "score";
  closeModal();
  save();
  render();
  toast("Match resumed — " + state.match.team1 + " vs " + state.match.team2);
}

function resumeFromHistory(idx) {
  const row = (window.__resumeRows || [])[idx];
  if (!row) return;
  if (row.type === "live") {
    closeModal();
    state.screen = "score";
    save();
    render();
    return;
  }
  resumeMatch(row.matchId);
}

function startFreshMatch(matchAlreadyDone) {
  const prev = state;

  // 1) Make sure the completed match is safely stored in history (idempotent).
  const done = matchAlreadyDone === true || !!prev.result || !!computeResult();
  saveMatchToHistory(); // no-op unless a completed match is unsaved

  // 2) If the current match is NOT finished, warn before replacing it.
  if (!done) {
    if (!confirm("Start a new match? The current unfinished match will be paused — resume it anytime from History (saved history stays safe).")) return;
    // never lose an unfinished match — keep it as a paused record
    const liveSnap = snapshotLiveMatch();
    if (liveSnap) {
      upsertPaused(liveSnap);
      try { fsUpdateActiveMatch(); } catch (e) {}
    }
  }

  // 3) Preserve app data only. Teams & players of the previous match are NOT
  //    copied into the new match — the user configures the next match manually
  //    (saved teams/players stay available in the databases to pick from).
  state = defaultState();
  state.matchHistory = prev.matchHistory || [];
  state.settings = prev.settings;
  state.user = prev.user;
  state.playerDB = prev.playerDB;
  state.teamDB = prev.teamDB;
  state.sync = prev.sync;
  state.pausedMatches = prev.pausedMatches || [];

  // 4) Fresh independent match state — a unique match ID is assigned when the
  //    user actually starts the match (see startMatch). Nothing is pre-filled.
  state.match = defaultMatch();
  state.match.matchId = "";
  state.innings = [null, null];
  state.inningsIndex = 0;
  state.result = null;
  state.resultShown = false;
  state.historySavedId = null;
  state.lastPotm = null;
  state.screen = "setup"; // → the existing Match Setup screen; wait for the user
  undoStack = [];
  pendingExtra = null;
  save();
  render();
}

function resetMatch() {
  // "New Match" from the setup screen — returns to a clean Match Setup form.
  startFreshMatch(false);
}

function scorecardText() {
  const m = state.match;
  let s = "======================================\n";
  s += "  CRICKET SCORECARD\n";
  s += "  " + m.team1 + " vs " + m.team2 + " (" + m.oversLimit + " overs)\n";
  s += "======================================\n\n";
  for (let idx = 0; idx < 2; idx++) {
    const inn = state.innings[idx];
    if (!inn) continue;
    s += (idx === 0 ? "1ST" : "2ND") + " INNINGS: " + inn.battingTeam + "  " + inn.runs + "/" + inn.wickets + " (" + oversStr(inn.legalBalls) + " ov)\n";
    s += "--------------------------------------\n";
    s += "BATTER            R   B   4s  6s   SR\n";
    inn.batters.forEach(function (b) {
      if (b.status === "didnotbat") return;
      const nm = (b.name + "                 ").slice(0, 16);
      s += nm + String(b.runs).padStart(3) + String(b.balls).padStart(4) + String(b.fours).padStart(4) + String(b.sixes).padStart(4) + String(strikeRate(b)).padStart(7) + "  " + (b.status === "out" ? b.how : "not out") + "\n";
    });
    const ex = inn.extras;
    s += "Extras: " + totalExtras(inn) + " (wd " + ex.wd + ", nb " + ex.nb + ", b " + ex.b + ", lb " + ex.lb + ")\n";
    s += "TOTAL: " + inn.runs + "/" + inn.wickets + " in " + oversStr(inn.legalBalls) + " ov | RR " + crr(inn) + "\n\n";
    if (inn.fow.length) {
      s += "FOW: " + inn.fow.map(function (f) { return f.runs + "-" + f.wickets + " (" + f.batter + ", " + f.over + ")"; }).join(", ") + "\n\n";
    }
    if (inn.bowlers.length) {
      s += "BOWLER          O    M   R   W   ECON\n";
      inn.bowlers.forEach(function (b) {
        const nm = (b.name + "               ").slice(0, 15);
        s += nm + String(oversStr(b.balls)).padStart(5) + String(b.maidens).padStart(4) + String(b.runs).padStart(4) + String(b.wickets).padStart(4) + String(econ(b)).padStart(7) + "\n";
      });
    }
    s += "\nBALL BY BALL:\n";
    inn.timeline.forEach(function (t) {
      s += "  " + t.over + "  " + t.chip + "\n";
    });
    s += "\n--------------------------------------\n\n";
  }
  if (state.result) {
    s += "RESULT: " + state.result.headline + "\n";
    s += state.result.sub + "\n";
    if (state.lastPotm) s += "PLAYER OF THE MATCH: " + state.lastPotm.name + " (" + state.lastPotm.note + ")\n";
  }
  return s;
}

  s += "  " + m.date + (m.matchId ? " • Match " + m.matchId : "") + "\n";
  s += "======================================\n\n";
  (m.innings || []).forEach(function (inn, idx) {
    s += (idx === 0 ? "1ST" : "2ND") + " INNINGS: " + inn.battingTeam + "  " + inn.runs + "/" + inn.wickets + " (" + oversStr(inn.balls) + " ov)\n";
    s += "--------------------------------------\n";
    s += "BATTER            R   B   4s  6s   SR\n";
    (inn.batters || []).forEach(function (b) {
      if (b.status === "didnotbat") return;
      const nm = (b.name + "                 ").slice(0, 16);
      s += nm + String(b.runs).padStart(3) + String(b.balls).padStart(4) + String(b.fours).padStart(4) + String(b.sixes).padStart(4) + String(strikeRate(b)).padStart(7) + "  " + (b.status === "out" ? b.how : "not out") + "\n";
    });
    const ex = inn.extras || { wd: 0, nb: 0, b: 0, lb: 0 };
    const tot = (ex.wd || 0) + (ex.nb || 0) + (ex.b || 0) + (ex.lb || 0);
    s += "Extras: " + tot + " (wd " + (ex.wd || 0) + ", nb " + (ex.nb || 0) + ", b " + (ex.b || 0) + ", lb " + (ex.lb || 0) + ")\n";
    s += "TOTAL: " + inn.runs + "/" + inn.wickets + " in " + oversStr(inn.balls) + " ov\n\n";
    if (inn.bowlers && inn.bowlers.length) {
      s += "BOWLER              O    R  W  M  ECON\n";
      inn.bowlers.forEach(function (b) {
        const nm = (b.name + "                 ").slice(0, 16);
        s += nm + String(oversStr(b.balls)).padStart(5) + String(b.runs).padStart(4) + String(b.wickets).padStart(3) + String(b.maidens).padStart(3) + String(b.balls ? (b.runs / (b.balls / 6)).toFixed(2) : "0.00").padStart(7) + "\n";
      });
      s += "\n";
    }
  });
  if (m.result && m.result.headline) s += "RESULT: " + m.result.headline + "\n";
  if (m.potm && m.potm.name) s += "POTM: " + m.potm.name + " — " + m.potm.note + "\n";
  s += "\n";
  return s;
}

function downloadHistoryScorecard(id) {
  const m = (state.matchHistory || []).find(function (x) { return x.id === id; });
  if (!m) return;
  const text = historyScorecardText(m);
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cricket-scorecard.txt";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("Scorecard downloaded!");
}

function downloadScorecard() {
  const text = scorecardText();
  const blob = new Blob([text], { type: "text/plain;charset=utf-8" });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "cricket-scorecard.txt";
  document.body.appendChild(a);
  a.click();
  setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast("Scorecard downloaded!");
}

function copyScore() {
  const parts = [];
  for (let idx = 0; idx < 2; idx++) {
    const inn = state.innings[idx];
    if (!inn) continue;
    parts.push(inn.battingTeam + " " + inn.runs + "/" + inn.wickets + " (" + oversStr(inn.legalBalls) + ")");
  }
  const txt = parts.join(" | ") + (state.result ? " — " + state.result.headline : "");
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(txt).then(function () { toast("Score copied!"); }, function () { fallbackCopy(txt); });
  } else fallbackCopy(txt);
}
function fallbackCopy(txt) {
  const ta = document.createElement("textarea");
  ta.value = txt;
  document.body.appendChild(ta);
  ta.select();
  try { document.execCommand("copy"); toast("Copied!"); } catch (e) { toast(txt); }
  ta.remove();
}

/* ============================================================
   INIT
============================================================ */
fsLoad();
loadSaved();
if (state.user.signedIn && state.screen === "auth") {
  state.screen = state.innings[0] ? "score" : "setup";
}
render();
applyUISettings();
initAppLifecycle();
maybeOfferRecovery();
</script>
